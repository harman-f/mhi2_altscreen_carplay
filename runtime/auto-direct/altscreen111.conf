# CarPlay stream-111 SOURCE / negotiation settings.
# These values describe the dedicated navigation display advertised to iOS.
# They are deliberately independent from config.txt, which controls the
# OneB1t Virtual Cockpit SINK geometry.
#
# Vehicle-proven IRC-parity baseline:
#   1010x376@30
#   no startup showUI
#   maps:/car/instrumentcluster
ALTSCREEN111_PORT=6031
ALTSCREEN111_TEE_PORT=19820
ALTSCREEN111_WIDTH=1010
ALTSCREEN111_HEIGHT=376
ALTSCREEN111_FPS=30
# Direct-VC output pacing is intentionally separate from the source descriptor.
# 30 fps remains the vehicle baseline. 40 fps is an explicit diagnostic option,
# not a new default; use direct_fps.sh and reconnect CarPlay after source changes.
DIRECT_OUTPUT_FPS=30
DIRECT_PACE=1
DIRECT_PACE_BUFFER=3
# Source timing diagnostics are lightweight one-second snapshots. They retain
# the raw Stream-111 timestamp words without assigning an unproven time unit.
ALTSCREEN111_TIMING_DEBUG=1
ALTSCREEN111_TIMING_INTERVAL_MS=1000
# When enabled, Auto-Direct persists one combined source/remux/MOST row per
# second into the per-session run directory.
DIRECT_TELEMETRY=1
# Optional metadata-preserving local transport. 0 keeps the vehicle-proven
# raw Annex-B TCP path. 1 selects M1AU v1 for the next renderer connection.
DIRECT_SOURCE_FRAMING=0
ALTSCREEN111_AUTO_SHOW=0
ALTSCREEN111_URL=maps:/car/instrumentcluster
