# MIBR platform defaults: MU1440 Skoda, 1010x376 cockpit stream. <capability>=<value>
# Safe areas read from photos of the calibration picture 2026-11-01, about +-8 px: clear of the cockpit top line and lane bar.
safe_voll=10,130,990,140
safe_wide=250,130,505,160
safe_center=380,130,250,160
# Input mapping (2026-11-08). Absent keys keep the compiled defaults; values are read once per boot.
# key.menu: OEM KeyListener code of the hardware key that closes the MIBR menu (lsd.jar KeyListener: 16=MENU,
#   1=MEDIA 2=TELEPHONE 3=NAVIGATION 5=CAR 6=SETTINGS 17=CLIMATE 33=HOME 34=SMARTPHONE).
key.menu=16
# Steering-wheel map zoom (GEN2 DebugSPI detector): wheel frame f9/02 detent source, f9/04 tag, pairing window.
zoom.wheel_source=40
zoom.tag=56
zoom.match_window_ms=40
# 1 = wheel detents zoom the CarPlay map automatically while DIRECT/control/video/zoom are active (SEAT/CUPRA);
# 0 = only with the debug arm file /tmp/mibr-alt111-zoom-v1.enabled.
zoom.wheel_auto=0
# Steering-wheel keys of the key40 daemon, keyboard/key (decimal). Absent keys keep these compiled values.
key.view_step=4/40
key.view_resync_long=4/40
key.carplay_switch_long=4/44
