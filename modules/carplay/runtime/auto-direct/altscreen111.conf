# CarPlay stream-111 SOURCE / negotiation settings.
# These values describe the dedicated navigation display advertised to iOS.
# They are deliberately independent from config.txt, which controls the
# OneB1t Virtual Cockpit SINK geometry.
#
# Vehicle-proven IRC-parity baseline:
#   1010x376@30
#   no startup showUI
#   maps:/car/instrumentcluster
ALTSCREEN111_PORT=6031
ALTSCREEN111_TEE_PORT=19820
ALTSCREEN111_WIDTH=1010
ALTSCREEN111_HEIGHT=376
ALTSCREEN111_FPS=30
# Direct-VC output pacing is intentionally separate from the source descriptor.
# The source remains capped at 30 fps unless a future source-side profile is
# deliberately changed; the direct output rate can be switched at runtime.
DIRECT_OUTPUT_FPS=30
DIRECT_PACE=1
DIRECT_PACE_BUFFER=3
ALTSCREEN111_AUTO_SHOW=0
ALTSCREEN111_URL=maps:/car/instrumentcluster
