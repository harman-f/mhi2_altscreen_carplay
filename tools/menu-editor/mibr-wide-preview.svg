<svg id="navv-wide-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 376" preserveAspectRatio="xMidYMid meet" role="img" aria-label="AID10 Wide: trapezförmige Seiteninstrumente, zentrale Karte und getrennte Navigationsanzeigen">
<defs>
<style>
#navv-wide-svg{font-family:Arial,"Helvetica Neue",Helvetica,sans-serif;font-variant-numeric:tabular-nums}
.w-primary{fill:#f7fbff;font-weight:600}.w-sub{fill:#d3dce8;font-weight:500}.w-small{font-size:14px}
</style>
<linearGradient id="w-surface" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#28344a"/><stop offset=".65" stop-color="#0d1728"/><stop offset="1" stop-color="#060b12"/></linearGradient>
<linearGradient id="w-panel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#38435e"/><stop offset=".48" stop-color="#263149"/><stop offset=".49" stop-color="#182438"/><stop offset="1" stop-color="#121b2d"/></linearGradient>
<linearGradient id="w-turn" x1="0" y1="1" x2="0" y2="0"><stop stop-color="#057a2d"/><stop offset=".45" stop-color="#29d946"/><stop offset="1" stop-color="#fff"/></linearGradient>
<pattern id="w-grid-fine" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M10 0H0V10" fill="none" stroke="#8f9cb0" stroke-opacity=".2" stroke-width=".6"/></pattern>
<pattern id="w-grid-coarse" width="100" height="50" patternUnits="userSpaceOnUse"><path d="M100 0H0V50" fill="none" stroke="#a9b7c8" stroke-opacity=".34" stroke-width="1.2"/></pattern>
<clipPath id="w-map-clip"><path d="M162.6 0H847.9L780.3 334H229.7Z"/></clipPath>
</defs>
<!-- P0.9.10: the AID10 display IS the 1010x376 stream; no bezel inset (geometry from rectified photos, AID10_CLUSTER_GEOMETRY_P099.json) -->
<rect x="0" y="0" width="1010" height="376" fill="url(#w-surface)"/>
<g id="wide-map-surface" clip-path="url(#w-map-clip)">
 <rect x="0" y="0" width="1010" height="376" fill="#142132"/>
 <g id="wide-grid"><rect x="0" y="0" width="1010" height="376" fill="url(#w-grid-fine)"/><rect x="0" y="0" width="1010" height="376" fill="url(#w-grid-coarse)"/><path d="M505 163v25m-12-13h24" stroke="#ed6667" stroke-width="1.4" fill="none"/></g>
 <g id="wide-map-visual" style="display:none">
   <rect x="0" y="0" width="1010" height="376" fill="#253a45"/>
   <path d="M297 79H698M300 139H704M300 235H701M348 35V344M430 35V345M559 37V343M638 37V345" stroke="#6e8091" stroke-width="27" fill="none"/>
   <path d="M297 79H698M300 139H704M300 235H701M348 35V344M430 35V345M559 37V343M638 37V345" stroke="#a4b4be" stroke-opacity=".7" stroke-width="2" fill="none"/>
   <rect x="372" y="163" width="34" height="49" fill="#364b55"/><rect x="578" y="168" width="35" height="42" fill="#314852"/>
 </g>
 <g id="wide-map-route">
   <path d="M503 326V241Q503 206 523 190L601 129" stroke="#0d1420" stroke-width="15" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
   <path d="M503 326V241Q503 206 523 190L601 129" stroke="#f7d325" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
   <path d="M494 302l9-16 9 16-9-4z" fill="#f53a3b" stroke="#fff" stroke-width="2"/>
 </g>
 <g id="wide-app-placeholder" style="display:none"><rect x="404" y="150" width="202" height="76" rx="8" fill="#0c1728" stroke="#527891" stroke-opacity=".6"/><text x="505" y="183" fill="#d8e7f5" text-anchor="middle" font-size="17" font-weight="600">CarPlay-App</text><text x="505" y="206" fill="#94acbd" text-anchor="middle" font-size="12">Vorschau · nur Editor</text></g>
 <g id="wide-off-placeholder" style="display:none"><text x="505" y="185" fill="#8ea4ba" text-anchor="middle" font-size="18" font-weight="600">CarPlay aus</text><text x="505" y="209" fill="#6f8398" text-anchor="middle" font-size="12">nur Editor</text></g>
</g>
<!-- MIBR_SHARED_TOP_BEGIN: common OEM status coordinates across Center/Wide/Voll (P0.9.10: measured on rectified photos, per-view bar/scrim/arrow box) -->
<defs><linearGradient id="wide-scrim-grad" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#04070d" stop-opacity=".66"/><stop offset=".55" stop-color="#04070d" stop-opacity=".5"/><stop offset="1" stop-color="#04070d" stop-opacity="0"/></linearGradient></defs>
<rect id="wide-top-scrim" x="0" y="37" width="1010" height="59" fill="url(#wide-scrim-grad)"/>
<path id="wide-top-bar" d="M0 0H1010V37H555L536 50.5H476L455 37H0Z" fill="#18263c"/>
<g id="wide-top-status" fill="#f5f9ff">
  <path d="M296 13l-6 17h12z" fill="#e7f0fb"/><text x="304" y="30" font-size="22" font-weight="600">W</text>
  <text x="505" y="40" text-anchor="middle" font-size="31" font-weight="600" letter-spacing=".5">23:22</text>
  <g transform="translate(654 22)" stroke="#2bc7eb" stroke-width="2.2" stroke-linecap="round"><path d="M0-10V10M-8.7-5L8.7 5M-8.7 5L8.7-5"/></g>
  <text x="665" y="30" font-size="22" font-weight="600">4.0°C</text>
  <path d="M0 37H455L476 50.5H536L555 37H1010" fill="none" stroke="#dce7f3" stroke-width="1.6" opacity=".83"/>
</g>
<g id="wide-top-text" fill="#f7fbff" text-anchor="middle">
  <rect id="wide-top-text-zone" x="367" y="60" width="275" height="24" rx="3" fill="#0b1423" opacity=".5"/>
  <text id="wide-top-label" x="505" y="77" font-size="21" font-weight="600">300 m · Hauptstraße</text>
</g>
<rect id="wide-arrow-box" x="367" y="89" width="275" height="35" fill="#4d5566"/>
<!-- MIBR_SHARED_TOP_END -->
<g id="wide-top-lanes" fill="none" stroke="#edf5fc" stroke-width="2.2" stroke-linecap="square">
 <!-- P0.9.10: arrow + lane separators x 487..524, y 100..120 inside the arrow box x 367..642, y 89..124 -->
 <path d="M487 100v20M524 100v20" opacity=".85"/>
 <path d="M505 118v-13m-5 5l5-5 5 5" stroke-width="3"/>
</g>
<g id="wide-side-panels">
 <!-- P0.9.10 measured: straight opaque inner edges x=0.2008*y+162.6 (left) and x=847.9-0.2023*y (right), y 0..334; bottom bar from y 334. -->
 <path d="M0 0H162.6L229.7 334H0Z" fill="url(#w-panel)"/>
 <path d="M1010 0H847.9L780.3 334H1010Z" fill="url(#w-panel)"/>
 <path d="M0 158H195M815 158H1010" stroke="#bcc9d9" stroke-opacity=".42" stroke-width="1.7"/>
 <path d="M162.6 0L229.7 334M847.9 0L780.3 334" fill="none" stroke="#ebf2fb" stroke-width="3" opacity=".84"/>
</g>
<g id="wide-left-info" text-anchor="middle">
 <text x="97" y="69" font-size="18" class="w-primary">7:20 h</text>
 <text x="97" y="94" font-size="17" class="w-sub">Ab Start</text>
 <path d="M107 161h-21l-8 32h38z" fill="#f3f7fc"/>
 <path d="M97 165v24" stroke="#1b293a" stroke-width="2.2" stroke-dasharray="6 6"/>
 <text x="97" y="222" font-size="22" class="w-primary">0 km</text>
 <text x="97" y="244" font-size="17" class="w-sub">Ab Start</text>
</g>
<g id="wide-right-media" transform="translate(102 -5)">
 <text x="815" y="100" text-anchor="middle" font-size="14" class="w-primary">Bluetooth-Audio</text>
</g>
<g id="wide-dial-lanes" transform="translate(105 -40)" fill="none" stroke="#e7effa" stroke-width="2">
 <path d="M769 174v19m24-19v19m24-19v19m24-19v19" opacity=".8"/>
 <path d="M772 179l12 11m0-11l-12 11M797 179l12 11m0-11l-12 11"/>
 <path d="M822 188v-9h12m-6-6l7 6-7 6" stroke-width="2.8"/>
</g>
<g id="wide-right-turn" transform="translate(81 -55)"><g transform="translate(49.2 13.9) scale(.94)">
 <!-- One closed silhouette: the white border is stroked on the exact same green path. -->
 <path id="wide-turn-silhouette" d="M803 262v-33q0-14 16-14h11v-12l25 19-25 18v-11h-10v33z" fill="url(#w-turn)" stroke="#f7fcff" stroke-width="2.9" stroke-linecap="round" stroke-linejoin="round"/>
</g></g>
<g id="wide-dial-distance" transform="translate(94 -66)" fill="#f4f8ff"><text x="821" y="296" text-anchor="middle" font-size="23" font-weight="650">300 m</text></g>
<!-- MIBR_SHARED_BOTTOM_BEGIN: identical OEM navigation/assist baseline across views (P0.9.10: measured on rectified photos, per-view band positions) -->
<path id="wide-bottom-strip" d="M224.1 306H786L780.3 334H229.7Z" fill="#3b4354"/>
<g id="wide-bottom-info" fill="#edf5ff" font-size="21" font-weight="600">
  <g id="wide-bottom-distance">
    <circle cx="376" cy="321" r="8.5" fill="none" stroke="#dce8f5" stroke-width="1.8"/>
    <path d="M376 309v24m-12-12h24" fill="none" stroke="#dce8f5" stroke-width="1.2"/>
    <text x="392" y="328">1.4 km</text>
  </g>
  <g id="wide-bottom-eta">
    <text id="wide-bottom-eta-label" x="570" y="328">23:22</text>
    <circle cx="634" cy="321" r="9" stroke="#e4eef8" stroke-width="1.8" fill="none"/>
    <path d="M634 314v7l5 4" stroke="#e4eef8" fill="none" stroke-width="1.6"/>
  </g>
</g>
<g id="wide-footer" fill="#d2deeb" font-size="21" font-weight="500">
  <rect id="wide-bottom-bar" x="0" y="334" width="1010" height="42" fill="#0c1728"/>
  <path d="M0 334.5H1010" stroke="#b6c8d9" stroke-width="1.3" opacity=".7"/>
  <text x="285" y="362"><tspan font-size="15">trip</tspan> 5936.7 km</text>
  <!-- Demonstration icons only; not evidence of independently writable BAP channels. -->
  <g id="wide-seatbelt-warning" transform="translate(454 338) scale(1.15)" fill="none" stroke="#ff3047" stroke-linecap="round" stroke-linejoin="round">
    <!-- Seated occupant, lap/shoulder restraint and buckle: warning pictogram, not a pedestrian. -->
    <circle cx="7" cy="3.5" r="2.5" fill="#ff3047" stroke="none"/>
    <path d="M5 8.5L4 15q0 2 3 3h5l4 3" stroke-width="2"/>
    <path d="M6.2 9l8 9.3" stroke-width="2.4"/>
    <path d="M3 11v9h13" stroke-width="1.6"/>
    <path d="M11 12.5l5.5 5.5" stroke-width="1.6"/>
    <rect x="12.5" y="18" width="3.8" height="2.4" rx=".6" fill="#ff3047" stroke="none"/>
  </g>
  <path d="M478 371l11-34h22l11 34" fill="#6c8097" opacity=".83"/>
  <path d="M489 337l-11 34m33-34l11 34" fill="none" stroke="#becbd9" stroke-width="1.8"/>
  <g id="wide-yellow-road-guidance" transform="translate(576 345) scale(1.5 1.4) translate(-566 -341)" fill="none" stroke="#f8d843" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <!-- Perspective road edges and an unmistakable dashed centre line, not two chevrons. -->
    <path d="M566 356l5-15M588 356l-5-15"/>
    <path d="M577 342v4m0 4v5" stroke-width="1.7"/>
  </g>
  <g transform="translate(613 344) scale(2) translate(-607 -342)" fill="none" stroke="#cbd9e7" stroke-width="1.15" opacity=".84">
    <path d="M608 354a8 8 0 1 1 13 0M614.5 350l3-4"/>
  </g>
  <text x="647" y="362">--- km/h</text>
</g>
<!-- MIBR_SHARED_BOTTOM_END -->
<g id="wide-speed" fill="#f6f9ff"><text x="908" y="343" text-anchor="middle" font-size="46" font-weight="600">0</text><text x="908" y="364" text-anchor="middle" font-size="17">km/h</text></g>
<image id="wide-photo" x="0" y="0" width="1010" height="376" preserveAspectRatio="none" opacity=".55" pointer-events="none" style="display:none"/>
<g id="wide-carplay-overlay" style="display:none">
 <rect x="402" y="217" width="198" height="62" rx="8" fill="#122338" stroke="#6bafc9" stroke-width="1.4"/>
 <text x="420" y="237" fill="#edf7ff" font-size="13">CarPlay-Manöverkarte</text>
 <text x="420" y="265" fill="#a2f7c6" font-size="19" font-weight="600">↱ 300 m</text>
</g>
</svg>