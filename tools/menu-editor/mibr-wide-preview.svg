 <text x="129" y="101" font-size="14.5" class="w-primary">7:20 h</text>
 <text x="129" y="122" font-size="14" class="w-sub">Ab Start</text>
 <path d="M185 202h-21l-8 44h38z" fill="#f3f7fc"/>
 <path d="M175 206v36" stroke="#1b293a" stroke-width="2.2" stroke-dasharray="6 6"/>
 <text x="178" y="279" text-anchor="middle" font-size="18.5" class="w-primary">0 km</text>
 <text x="178" y="300" text-anchor="middle" font-size="14" class="w-sub">Ab Start</text>
</g>
<g id="wide-right-media">
 <text x="815" y="100" text-anchor="middle" font-size="14" class="w-primary">Bluetooth-Audio</text>
 <g stroke="#d7e1ef" stroke-width="2" fill="none"><path d="M818 133l9 6v13l-9 6zM816 137v17M834 140q8 8 0 16"/></g>
</g>
<g id="wide-dial-lanes" fill="none" stroke="#e7effa" stroke-width="2">
 <path d="M769 174v19m24-19v19m24-19v19m24-19v19" opacity=".8"/>
 <path d="M772 179l12 11m0-11l-12 11M797 179l12 11m0-11l-12 11"/>
 <path d="M822 188v-9h12m-6-6l7 6-7 6" stroke-width="2.8"/>
</g>
<g id="wide-right-turn" transform="translate(49.2 13.9) scale(.94)">
 <!-- One closed silhouette: the white border is stroked on the exact same green path. -->
 <path id="wide-turn-silhouette" d="M803 262v-33q0-14 16-14h11v-12l25 19-25 18v-11h-10v33z" fill="url(#w-turn)" stroke="#f7fcff" stroke-width="2.9" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<g id="wide-dial-distance" fill="#f4f8ff"><text x="821" y="296" text-anchor="middle" font-size="19" font-weight="650">300 m</text></g>
<g id="wide-speed" fill="#f6f9ff"><text x="846" y="332" text-anchor="middle" font-size="29" font-weight="650">0</text><text x="846" y="348" text-anchor="middle" font-size="13">km/h</text></g>
<!-- MIBR_SHARED_BOTTOM_BEGIN: identical OEM navigation/assist baseline across views -->
<g id="wide-bottom-info" fill="#edf5ff" font-size="14" font-weight="600">
  <g id="wide-bottom-distance">
    <circle cx="420" cy="314" r="7.2" fill="none" stroke="#dce8f5" stroke-width="1.5"/>
    <path d="M420 302v24m-12-12h24" fill="none" stroke="#dce8f5" stroke-width="1.05"/>
    <text x="437" y="319">1.4 km</text>
  </g>
  <g id="wide-bottom-eta">
    <text id="wide-bottom-eta-label" x="550" y="319">23:22</text>
    <circle cx="600" cy="314" r="7.8" stroke="#e4eef8" stroke-width="1.5" fill="none"/>
    <path d="M600 308v6l4 3" stroke="#e4eef8" fill="none" stroke-width="1.4"/>
  </g>
</g>
<g id="wide-footer" fill="#d2deeb" font-size="11.5" font-weight="500">
  <path d="M371 333H659" stroke="#b6c8d9" stroke-width="1.15" opacity=".55"/>
  <rect x="377" y="335" width="286" height="27" rx="2" fill="#0c1728" opacity=".64"/>
  <text x="387" y="353">trip 5936.7 km</text>
  <!-- Demonstration icons only; not evidence of independently writable BAP channels. -->
  <g id="wide-seatbelt-warning" transform="translate(485 336)" fill="none" stroke="#ff3047" stroke-linecap="round" stroke-linejoin="round">
    <!-- Seated occupant, lap/shoulder restraint and buckle: warning pictogram, not a pedestrian. -->
    <circle cx="7" cy="3.5" r="2.5" fill="#ff3047" stroke="none"/>
    <path d="M5 8.5L4 15q0 2 3 3h5l4 3" stroke-width="2"/>
    <path d="M6.2 9l8 9.3" stroke-width="2.4"/>
    <path d="M3 11v9h13" stroke-width="1.6"/>
    <path d="M11 12.5l5.5 5.5" stroke-width="1.6"/>
    <rect x="12.5" y="18" width="3.8" height="2.4" rx=".6" fill="#ff3047" stroke="none"/>
  </g>
  <path d="M516 358l7-20h11l7 20" fill="#6c8097" opacity=".83"/>
  <path d="M522 339l-6 19m18-19l7 19" fill="none" stroke="#becbd9" stroke-width="1.55"/>
  <g id="wide-yellow-road-guidance" fill="none" stroke="#f8d843" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <!-- Perspective road edges and an unmistakable dashed centre line, not two chevrons. -->
    <path d="M566 356l5-15M588 356l-5-15"/>
    <path d="M577 342v4m0 4v5" stroke-width="1.7"/>
  </g>
  <g fill="none" stroke="#cbd9e7" stroke-width="1.15" opacity=".84">
    <path d="M608 354a8 8 0 1 1 13 0M614.5 350l3-4"/>
  </g>
  <text x="633" y="353" font-size="10">--- km/h</text>
</g>
<!-- MIBR_SHARED_BOTTOM_END -->
<g id="wide-side-metrics" fill="#dbe9f8" font-size="14" font-weight="550">
 <g text-anchor="end" dominant-baseline="middle"><text x="32" y="133">130</text><text x="32" y="183">90</text><text x="32" y="268">50</text></g>
 <path d="M39 133h27m-27 50h27m-27 85h27" stroke="#8699ad" stroke-width="2.5" opacity=".6"/>
 <g text-anchor="start" dominant-baseline="middle"><text x="979" y="130">1/1</text><text x="979" y="179">1/2</text><text x="979" y="270">R</text></g>
 <path d="M943 130h29m-29 49h29m-29 91h29" stroke="#dfeaf9" stroke-width="3.3"/>
</g>
<g id="wide-carplay-overlay" style="display:none">
 <rect x="402" y="217" width="198" height="62" rx="8" fill="#122338" stroke="#6bafc9" stroke-width="1.4"/>
 <text x="420" y="237" fill="#edf7ff" font-size="13">CarPlay-Manöverkarte</text>
 <text x="420" y="265" fill="#a2f7c6" font-size="19" font-weight="600">↱ 300 m</text>
</g>
</svg>