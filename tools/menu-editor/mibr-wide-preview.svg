<svg id="navv-wide-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 376" preserveAspectRatio="xMidYMid meet" role="img" aria-label="AID10 Wide: trapezförmige Seiteninstrumente, zentrale Karte und getrennte Navigationsanzeigen">
<defs>
<style>
#navv-wide-svg{font-family:Arial,"Helvetica Neue",Helvetica,sans-serif;font-variant-numeric:tabular-nums}
.w-primary{fill:#f7fbff;font-weight:600}.w-sub{fill:#d3dce8;font-weight:500}.w-small{font-size:14px}
</style>
<linearGradient id="w-surface" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#28344a"/><stop offset=".65" stop-color="#0d1728"/><stop offset="1" stop-color="#060b12"/></linearGradient>
<linearGradient id="w-panel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#38435e"/><stop offset=".48" stop-color="#263149"/><stop offset=".49" stop-color="#182438"/><stop offset="1" stop-color="#121b2d"/></linearGradient>
<linearGradient id="w-turn" x1="0" y1="1" x2="0" y2="0"><stop stop-color="#057a2d"/><stop offset=".45" stop-color="#29d946"/><stop offset="1" stop-color="#fff"/></linearGradient>
<pattern id="w-grid-fine" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M12 0H0V12" fill="none" stroke="#a1acbd" stroke-opacity=".18" stroke-width=".6"/></pattern>
<pattern id="w-grid-coarse" width="95" height="52" patternUnits="userSpaceOnUse"><path d="M95 0H0V52" fill="none" stroke="#bfc7d5" stroke-opacity=".31" stroke-width="1.4"/></pattern>
<clipPath id="w-map-clip"><path d="M284 37H723L685 329H331Z"/></clipPath>
</defs>
<rect x="2" y="2" width="1006" height="372" rx="53" fill="#030508" stroke="#1e2a38" stroke-width="3"/>
<path d="M93 23H917Q941 23 942 58V329Q940 355 907 355H101Q68 355 67 324V58Q67 23 93 23Z" fill="url(#w-surface)"/>
<g id="wide-map-surface" clip-path="url(#w-map-clip)">
 <rect x="276" y="37" width="465" height="310" fill="#142132"/>
 <g id="wide-grid"><rect x="276" y="37" width="465" height="310" fill="url(#w-grid-fine)"/><rect x="276" y="37" width="465" height="310" fill="url(#w-grid-coarse)"/><path d="M505 163v25m-12-13h24" stroke="#ed6667" stroke-width="1.4" fill="none"/></g>
 <g id="wide-map-visual" style="display:none">
   <rect x="276" y="37" width="465" height="310" fill="#253a45"/>
   <path d="M297 79H698M300 139H704M300 235H701M348 35V344M430 35V345M559 37V343M638 37V345" stroke="#6e8091" stroke-width="27" fill="none"/>
   <path d="M297 79H698M300 139H704M300 235H701M348 35V344M430 35V345M559 37V343M638 37V345" stroke="#a4b4be" stroke-opacity=".7" stroke-width="2" fill="none"/>
   <rect x="372" y="163" width="34" height="49" fill="#364b55"/><rect x="578" y="168" width="35" height="42" fill="#314852"/>
 </g>
 <g id="wide-map-route">
   <path d="M503 326V241Q503 206 523 190L601 129" stroke="#0d1420" stroke-width="15" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
   <path d="M503 326V241Q503 206 523 190L601 129" stroke="#f7d325" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
   <path d="M494 302l9-16 9 16-9-4z" fill="#f53a3b" stroke="#fff" stroke-width="2"/>
 </g>
 <g id="wide-app-placeholder" style="display:none"><rect x="404" y="150" width="202" height="76" rx="8" fill="#0c1728" stroke="#527891" stroke-opacity=".6"/><text x="505" y="183" fill="#d8e7f5" text-anchor="middle" font-size="17" font-weight="600">CarPlay-App</text><text x="505" y="206" fill="#94acbd" text-anchor="middle" font-size="12">Vorschau · nur Editor</text></g>
 <g id="wide-off-placeholder" style="display:none"><text x="505" y="185" fill="#8ea4ba" text-anchor="middle" font-size="18" font-weight="600">CarPlay aus</text><text x="505" y="209" fill="#6f8398" text-anchor="middle" font-size="12">nur Editor</text></g>
</g>
<g id="wide-side-panels">
 <path d="M90 25H283L331 330Q328 348 294 352H98Q74 352 70 326V60Q71 25 90 25Z" fill="url(#w-panel)" stroke="#8795aa" stroke-width="1.3"/>
 <path d="M920 25H725L683 331Q687 350 715 352H911Q938 352 940 325V60Q939 25 920 25Z" fill="url(#w-panel)" stroke="#8795aa" stroke-width="1.3"/>
 <path d="M92 180H309M700 180H918" stroke="#bcc9d9" stroke-opacity=".42" stroke-width="1.7"/>
 <path d="M284 26L331 330M724 26L683 331" stroke="#ebf2fb" stroke-width="3" opacity=".84"/>
</g>
<!-- MIBR_SHARED_TOP_BEGIN: common OEM status coordinates across Center/Wide/Voll -->
<g id="wide-top-status" fill="#f5f9ff">
  <path d="M384 31l-6 13h12z" fill="#e7f0fb"/><text x="399" y="43" font-size="15.5" font-weight="600">W</text>
  <text x="505" y="43" text-anchor="middle" font-size="24" font-weight="650" letter-spacing=".1">23:22</text>
  <g transform="translate(623 34)" stroke="#2bc7eb" stroke-width="1.8" stroke-linecap="round"><path d="M0-8V8M-7-4L7 4M-7 4L7-4"/></g>
  <text x="640" y="43" font-size="15.5" font-weight="600">4.0°C</text>
  <path d="M394 60H466l8 6h64l8-6h70" fill="none" stroke="#dce7f3" stroke-width="1.35" opacity=".83"/>
</g>
<g id="wide-top-text" fill="#f7fbff" text-anchor="middle">
  <rect x="394" y="74" width="222" height="27" rx="3" fill="#0b1423" opacity=".84"/>
  <text id="wide-top-label" x="505" y="93" font-size="15.5" font-weight="600">300 m · Hauptstraße</text>
</g>
<!-- MIBR_SHARED_TOP_END -->
<g id="wide-top-lanes" fill="none" stroke="#edf5fc" stroke-width="2.2" stroke-linecap="square">
 <path d="M459 112v23m29-23v23m29-23v23m32-23v23" opacity=".85"/>
 <path d="M464 117l14 14m0-14l-14 14M494 117l14 14m0-14l-14 14"/>
 <path d="M533 132v-15h12m-6-6l7 6-7 6" stroke-width="3"/>
</g>
