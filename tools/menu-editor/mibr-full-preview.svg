<svg id="navv-full-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 376" preserveAspectRatio="xMidYMid meet" role="img" aria-label="AID10 Voll: durchgehende Kartenansicht, obere Navigation und untere Cockpit-Statusleiste">
<defs>
<style>#navv-full-svg{font-family:Arial,"Helvetica Neue",Helvetica,sans-serif;font-variant-numeric:tabular-nums}.f-main{fill:#f5f8ff;font-weight:600}.f-sub{fill:#d4dce9;font-weight:500}</style>
<linearGradient id="f-display" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#283248"/><stop offset=".38" stop-color="#182538"/><stop offset="1" stop-color="#090e19"/></linearGradient>
<linearGradient id="f-mapbg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#1f3045"/><stop offset=".7" stop-color="#121f32"/><stop offset="1" stop-color="#0b1525"/></linearGradient>
<linearGradient id="f-cutout" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#111a2a"/><stop offset="1" stop-color="#060911"/></linearGradient>
<pattern id="f-grid-fine" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M10 0H0V10" fill="none" stroke="#8f9cb0" stroke-opacity=".2" stroke-width=".6"/></pattern>
<pattern id="f-grid-major" width="100" height="50" patternUnits="userSpaceOnUse"><path d="M100 0H0V50" fill="none" stroke="#a9b7c8" stroke-opacity=".34" stroke-width="1.2"/></pattern>
<clipPath id="f-mainclip"><path d="M0 0H1010V276H871Q863 276 857 284L816 335H216L174 284Q168 276 160 276H0Z"/></clipPath>
</defs>
<!-- P0.9.9: the AID10 display IS the 1010x376 stream; no bezel inset (geometry from rectified photos, AID10_CLUSTER_GEOMETRY_P099.json) -->
<rect x="0" y="0" width="1010" height="376" fill="url(#f-display)"/>
<g id="full-map-surface" clip-path="url(#f-mainclip)">
 <rect x="0" y="0" width="1010" height="376" fill="url(#f-mapbg)"/>
 <g id="full-grid"><rect x="0" y="0" width="1010" height="376" fill="url(#f-grid-fine)"/><rect x="0" y="0" width="1010" height="376" fill="url(#f-grid-major)"/>
   <path d="M496 167v28m-14-14h28" stroke="#e14c55" stroke-width="2" fill="none" opacity=".75"/>
 </g>
 <g id="full-map-visual" style="display:none">
   <rect x="0" y="0" width="1010" height="376" fill="#263b48"/>
   <path d="M110 82H915M106 157H914M101 247H920M190 20V353M325 20V356M462 20V351M619 20V353M756 20V355M862 20V355" stroke="#667e8d" stroke-width="27" fill="none"/>
   <path d="M110 82H915M106 157H914M101 247H920M190 20V353M325 20V356M462 20V351M619 20V353M756 20V355M862 20V355" stroke="#aec0cc" stroke-opacity=".7" stroke-width="2.3" fill="none"/>
   <rect x="218" y="177" width="70" height="42" rx="4" fill="#374e5a"/><rect x="656" y="178" width="71" height="48" rx="4" fill="#344c59"/>
 </g>
 <g id="full-map-route">
   <path d="M500 336V230Q500 210 524 195Q552 181 592 181H795" fill="none" stroke="#101827" stroke-width="19" stroke-linecap="round"/>
   <path d="M500 336V230Q500 210 524 195Q552 181 592 181H795" fill="none" stroke="#f2cc15" stroke-width="7.5" stroke-linecap="round"/>
   <path d="M785 172l18 9-18 9v-6h-20v-6h20z" fill="#fff1a3"/>
   <path d="M500 292l-13 21 13-8 13 8z" stroke="#fff" stroke-width="2.7" fill="#ed383f"/>
 </g>
 <g id="full-app-placeholder" style="display:none"><rect x="389" y="145" width="234" height="85" rx="10" fill="#0c1728" stroke="#527891" stroke-opacity=".6"/><text x="506" y="180" fill="#d8e7f5" text-anchor="middle" font-size="18" font-weight="600">CarPlay-App</text><text x="506" y="204" fill="#94acbd" text-anchor="middle" font-size="12">Vorschau · nur Editor</text></g>
 <g id="full-off-placeholder" style="display:none"><text x="506" y="183" fill="#8ea4ba" text-anchor="middle" font-size="19" font-weight="600">CarPlay aus</text><text x="506" y="209" fill="#6f8398" text-anchor="middle" font-size="12">nur Editor</text></g>
</g>
<!-- MIBR_SHARED_TOP_BEGIN: common OEM status coordinates across Center/Wide/Voll (P0.9.9: measured on rectified photos) -->
<g id="full-top-status" fill="#f5f9ff">
  <path d="M296 13l-6 17h12z" fill="#e7f0fb"/><text x="304" y="30" font-size="22" font-weight="600">W</text>
  <text x="505" y="40" text-anchor="middle" font-size="31" font-weight="600" letter-spacing=".5">23:22</text>
  <g transform="translate(654 22)" stroke="#2bc7eb" stroke-width="2.2" stroke-linecap="round"><path d="M0-10V10M-8.7-5L8.7 5M-8.7 5L8.7-5"/></g>
  <text x="665" y="30" font-size="22" font-weight="600">4.0°C</text>
  <path d="M0 38H454L474 51H539L559 38H1010" fill="none" stroke="#dce7f3" stroke-width="1.6" opacity=".83"/>
</g>
<g id="full-top-text" fill="#f7fbff" text-anchor="middle">
  <rect x="395" y="60" width="220" height="27" rx="3" fill="#0b1423" opacity=".5"/>
  <text id="full-top-label" x="505" y="80" font-size="21" font-weight="600">100 m · Hauptstraße</text>
</g>
<!-- MIBR_SHARED_TOP_END -->
<g id="full-top-lanes" transform="translate(0 -20)" fill="none" stroke="#f1f5fc" stroke-width="2.2" stroke-linecap="square">
 <path d="M449 112v23m31-23v23m31-23v23m33-23v23" stroke-opacity=".7"/>
 <path d="M455 116l14 14m0-14l-14 14M487 116l14 14m0-14l-14 14"/>
 <path d="M526 131v-15h12m-6-6l8 6-8 6" stroke-width="3"/>
</g>
<g id="full-lower-corners">
 <!-- Measured: flat top at y 276 out to x 160 / 871, slope to x 250 / 782 at the bottom edge. -->
 <path d="M0 276H160Q168 276 174 284L250 376H0Z" fill="url(#f-cutout)"/>
 <path d="M1010 276H871Q863 276 857 284L782 376H1010Z" fill="url(#f-cutout)"/>
 <path d="M0 276H160Q168 276 174 284L250 376M1010 276H871Q863 276 857 284L782 376" fill="none" stroke="#dce9f5" stroke-width="2" opacity=".93"/>
</g>
<!-- MIBR_SHARED_BOTTOM_BEGIN: identical OEM navigation/assist baseline across views (P0.9.9: measured on rectified photos) -->
<g id="full-bottom-info" fill="#edf5ff" font-size="21" font-weight="600">
  <g id="full-bottom-distance">
    <circle cx="376" cy="321" r="8.5" fill="none" stroke="#dce8f5" stroke-width="1.8"/>
    <path d="M376 309v24m-12-12h24" fill="none" stroke="#dce8f5" stroke-width="1.2"/>
    <text x="392" y="328">1.2 km</text>
  </g>
  <g id="full-bottom-eta">
    <text id="full-bottom-eta-label" x="562" y="328">23:23</text>
    <circle cx="631" cy="321" r="9" stroke="#e4eef8" stroke-width="1.8" fill="none"/>
    <path d="M631 314v7l5 4" stroke="#e4eef8" fill="none" stroke-width="1.6"/>
  </g>
</g>
<g id="full-footer" fill="#d2deeb" font-size="21" font-weight="500">
  <path d="M216 335H816" stroke="#b6c8d9" stroke-width="1.3" opacity=".6"/>
  <rect x="262" y="336" width="486" height="40" fill="#0c1728" opacity=".8"/>
  <text x="283" y="362"><tspan font-size="15">trip</tspan> 5936.7 km</text>
  <!-- Demonstration icons only; not evidence of independently writable BAP channels. -->
  <g id="full-seatbelt-warning" transform="translate(453 342) scale(1.15)" fill="none" stroke="#ff3047" stroke-linecap="round" stroke-linejoin="round">
    <!-- Seated occupant, lap/shoulder restraint and buckle: warning pictogram, not a pedestrian. -->
    <circle cx="7" cy="3.5" r="2.5" fill="#ff3047" stroke="none"/>
    <path d="M5 8.5L4 15q0 2 3 3h5l4 3" stroke-width="2"/>
    <path d="M6.2 9l8 9.3" stroke-width="2.4"/>
    <path d="M3 11v9h13" stroke-width="1.6"/>
    <path d="M11 12.5l5.5 5.5" stroke-width="1.6"/>
    <rect x="12.5" y="18" width="3.8" height="2.4" rx=".6" fill="#ff3047" stroke="none"/>
  </g>
  <path d="M484 376l11-38h20l11 38" fill="#6c8097" opacity=".83"/>
  <path d="M494 338l-10 38m31-38l10 38" fill="none" stroke="#becbd9" stroke-width="1.8"/>
  <g id="full-yellow-road-guidance" transform="translate(576 345) scale(1.5 1.4) translate(-566 -341)" fill="none" stroke="#f8d843" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <!-- Perspective road edges and an unmistakable dashed centre line, not two chevrons. -->
    <path d="M566 356l5-15M588 356l-5-15"/>
    <path d="M577 342v4m0 4v5" stroke-width="1.7"/>
  </g>
  <g transform="translate(613 344) scale(2) translate(-607 -342)" fill="none" stroke="#cbd9e7" stroke-width="1.15" opacity=".84">
    <path d="M608 354a8 8 0 1 1 13 0M614.5 350l3-4"/>
  </g>
  <text x="647" y="362">--- km/h</text>
</g>
<!-- MIBR_SHARED_BOTTOM_END -->
<g id="full-speed" fill="#fff">
 <text x="908" y="343" text-anchor="middle" font-size="46" font-weight="600">0</text>
 <text x="908" y="364" text-anchor="middle" font-size="17">km/h</text>
</g>
<image id="full-photo" x="0" y="0" width="1010" height="376" preserveAspectRatio="none" opacity=".55" pointer-events="none" style="display:none"/>
<g id="full-carplay-overlay" style="display:none">
 <rect x="426" y="218" width="186" height="58" rx="8" fill="#152337" stroke="#76aac3" stroke-width="1.5"/>
 <text x="440" y="239" fill="#ecf8ff" font-size="13">CarPlay-Manöverkarte</text>
 <text x="441" y="260" fill="#aaf8c9" font-size="18" font-weight="650">↱ 100 m</text>
</g>
</svg>