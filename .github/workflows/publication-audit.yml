name: Publication integrity audit

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  audit:
    name: Publication integrity audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Audit public tree
        shell: bash
        run: |
          set -euxo pipefail
          python3 tools/audit_public_repo.py
          test -s docs/architecture/ADVANCED_RUNTIME_SWITCHES.md
          grep -Fq 'ADVANCED_RUNTIME_SWITCHES.md' README.md

      - name: Canonical module ownership and dependency gate
        shell: bash
        run: |
          set -euxo pipefail
          python3 tools/check_module_index.py --self-test

      - name: Three mandatory beta firmware profiles
        shell: bash
        run: |
          set -euxo pipefail
          python3 tools/release/plan_multi_profile_beta.py --self-test --json-out "$RUNNER_TEMP/beta-profiles.json"

      - name: Source-defined configuration and unit storage inventory
        shell: bash
        run: |
          set -euxo pipefail
          python3 tools/release/source_defaults_inventory.py --self-test --json-out "$RUNNER_TEMP/source-defaults-inventory.json"
          python3 tools/release/storage_migration_review.py --self-test --json-out "$RUNNER_TEMP/storage-migration-review.json"
          python3 tools/release/storage_path_triage.py --self-test --review-json "$RUNNER_TEMP/storage-migration-review.json" --json-out "$RUNNER_TEMP/storage-path-triage.json"
          python3 tools/release/storage_consumer_crosscheck.py --self-test --json-out "$RUNNER_TEMP/storage-consumer-crosscheck.json"

      - name: Upload source-defined inventory (host evidence only)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-defaults-unit-path-inventory
          path: |
            ${{ runner.temp }}/source-defaults-inventory.json
            ${{ runner.temp }}/storage-migration-review.json
            ${{ runner.temp }}/storage-path-triage.json
            ${{ runner.temp }}/storage-consumer-crosscheck.json
          if-no-files-found: error
          retention-days: 3

      - name: Modular distribution contract regression gate
        shell: bash
        run: |
          set -euxo pipefail
          test -s docs/build/PACKAGE_LAYOUT.md
          python3 tools/validate_modular_package.py --self-test


      - name: Release module graph and complete QNX script preflight
        shell: bash
        run: |
          set -euxo pipefail
          python3 tools/release/module_plan.py --self-test
          python3 tools/release/qnx_scripts.py --self-test --canonical
          python3 tools/release/audit_legacy.py --self-test
          # Source inventory, static-only. The release workflow separately
          # validates the actual staged scripts and the final ZIP after merge.

      - name: Stage and inspect exact MU1440 on-unit shell inventory
        shell: bash
        run: |
          set -euxo pipefail
          staging="$(mktemp -d)"
          trap 'rm -rf "$staging"' EXIT
          bash tools/prepare_mu1440_sd.sh "$staging"
          python3 tools/release/qnx_scripts.py --package-root "$staging"
          (cd "$staging" && sha256sum -c PAYLOAD.sha256)
          # This is a host-only source/package test, not a release.

      - name: Public standalone MIBR/3 source checks
        shell: bash
        run: |
          set -euxo pipefail
          python3 -B tests/test_public_mibr3.py

      - name: Public Java HMI protocol/model host compilation
        shell: bash
        run: |
          set -euxo pipefail
          javac -version
          build_dir="$(mktemp -d)"
          javac -d "$build_dir" src/experimental/hmi-model/java/de/mibr/hmi/*.java
          java -cp "$build_dir" de.mibr.hmi.PublicProtocolSmokeTest
          rm -rf "$build_dir"

      - name: Every QNX handoff must pass target-shell preflight
        shell: bash
        run: |
          set -euxo pipefail
          test -s AGENTS.md
          grep -Fq 'MU1440_QNX_SHELL_COMPATIBILITY.md' AGENTS.md
          test -s docs/testing/MU1440_QNX_SHELL_COMPATIBILITY.md
          python3 tools/check_mu1440_target_shell.py --self-test --check \
            runtime/diagnostics/keypanel_trace_discovery.sh
          # The existing broader deployment/runtime shell-regression step remains
          # mandatory below. One-off private ZIPs cannot be inspected by GitHub CI:
          # AGENTS.md requires this same checker on all extracted target scripts.

      - name: Deployment smoke audit
        shell: bash
        run: |
          set -euxo pipefail

          bash -n deployment/mu1440/install.sh
          bash -n deployment/mu1440/uninstall.sh
          bash -n deployment/mu1440/status.sh
          bash -n deployment/mu1440/compatibility-report.sh
          bash -n runtime/diagnostics/keypanel_trace_discovery.sh
          bash -n runtime/diagnostics/keypanel_capture.sh
          bash -n runtime/diagnostics/keypanel_note.sh
          grep -Fq '/mnt/app/root/mibr-alt111-keyframe-policy.enabled' runtime/diagnostics/gen2_keyframes.sh
          bash -n modules/carplay/runtime/auto-direct/common.sh
          bash -n runtime/deployment/session.sh
          bash -n modules/carplay/runtime/isotx2-gate/install_preload.sh
          bash -n modules/carplay/runtime/isotx2-gate/restore_preload.sh
          bash -n modules/carplay/runtime/isotx2-gate/verify_preload_boot.sh
          bash -n tools/prepare_mu1440_sd.sh

          for f in \
            artifacts/mu1440/altscreen111/vehicle-tested-2026-09-27/libaltscreen111.so \
            artifacts/mu1440/direct-ts-remux/vehicle-tested-2026-09-27/direct-ts-remux \
            artifacts/mu1440/isotx2-gate/vehicle-tested-2026-09-27/libmibr_isotx2_gate.so \
            artifacts/mu1440/navignore/vehicle-tested-2026-09-27/MIBR-NavIgnore.jar \
            artifacts/mu1440/most20fps/vehicle-tested-2026-09-29/MIBR-Most20FPS.jar \
            artifacts/mu1440/sha256sum-compat/build-confirmed-current/sha256sum \
            modules/carplay/runtime/auto-direct/common.sh \
            modules/carplay/runtime/auto-direct/patch_carplay.sh \
            modules/carplay/runtime/auto-direct/restore_stock.sh \
            modules/carplay/runtime/auto-direct/verify_carplay111_boot.sh \
            modules/carplay/runtime/auto-direct/direct_ts_auto_enable.sh \
            modules/carplay/runtime/auto-direct/direct_ts_auto_disable.sh \
            modules/carplay/runtime/auto-direct/direct_ts_auto_start.sh \
            modules/carplay/runtime/auto-direct/direct_ts_auto_stop.sh \
            modules/carplay/runtime/auto-direct/direct_ts_auto_status.sh \
            modules/carplay/runtime/auto-direct/direct_fps.sh \
            modules/carplay/runtime/auto-direct/direct_ts_auto_supervisor.sh \
            modules/carplay/runtime/auto-direct/direct_ts_auto_watchdog.sh \
            modules/carplay/runtime/auto-direct/writev_gate.sh \
            modules/carplay/runtime/auto-direct/altscreen111.conf \
            runtime/deployment/session.sh \
            deployment/mu1440/compatibility-report.sh \
            modules/carplay/runtime/isotx2-gate/install_preload.sh \
            modules/carplay/runtime/isotx2-gate/restore_preload.sh \
            runtime/diagnostics/gen2_keyframes.sh \
            runtime/diagnostics/gen2_resync.sh \
            runtime/diagnostics/gen2_status.sh \
            runtime/diagnostics/keypanel_trace_discovery.sh \
            runtime/diagnostics/keypanel_capture.sh \
            runtime/diagnostics/keypanel_note.sh \
            modules/navigation/runtime/gen2_nav_config.sh \
            modules/navigation/runtime/gen2_safearea.sh
          do
            test -s "$f"
          done

          test "$(sha256sum artifacts/mu1440/altscreen111/vehicle-tested-2026-09-27/libaltscreen111.so | awk '{print $1}')" = \
            "094e3f1abfbf949f8c11b27e048e8213e5fc71178e62efd3c56deed8ee3bf8d8"
          test "$(sha256sum artifacts/mu1440/direct-ts-remux/vehicle-tested-2026-09-27/direct-ts-remux | awk '{print $1}')" = \
            "b761a8741682e3cbc6e05f5fe1705475c34c4805d1cd1ce09333274a301e735e"
          test "$(sha256sum artifacts/mu1440/isotx2-gate/vehicle-tested-2026-09-27/libmibr_isotx2_gate.so | awk '{print $1}')" = \
            "05673010a88c25022145ffb4e75d3715eaf686f4127ac188e91a52f512b9d957"
          test "$(sha256sum artifacts/mu1440/navignore/vehicle-tested-2026-09-27/MIBR-NavIgnore.jar | awk '{print $1}')" = \
            "b065bab0e1c58f8439a3bdd73d2d4cb6060cbac1c943e5b425425eb453c94b34"
          test "$(sha256sum artifacts/mu1440/most20fps/vehicle-tested-2026-09-29/MIBR-Most20FPS.jar | awk '{print $1}')" = \
            "dbd45609fe4ba69948d39e9e649b224484f680f6aa7934b68c261a4d360ea5bb"

          grep -Fq 'EXPECTED_GEN2=094e3f1abfbf949f8c11b27e048e8213e5fc71178e62efd3c56deed8ee3bf8d8' deployment/mu1440/install.sh
          grep -Fq 'EXPECTED_REMUX=b761a8741682e3cbc6e05f5fe1705475c34c4805d1cd1ce09333274a301e735e' deployment/mu1440/install.sh
          grep -Fq 'EXPECTED_GATE=05673010a88c25022145ffb4e75d3715eaf686f4127ac188e91a52f512b9d957' deployment/mu1440/install.sh
          grep -Fq 'EXPECTED_MOST20=dbd45609fe4ba69948d39e9e649b224484f680f6aa7934b68c261a4d360ea5bb' deployment/mu1440/install.sh
          grep -Fq 'EXPECTED_LSD_JXE=a55d9cfb69c5756f8202b7f7aa4079d4d5b637ae4c2fd0fe723f1d6816cbeea8' deployment/mu1440/install.sh
          grep -Fq 'profile map-rich' deployment/mu1440/install.sh

          ! grep -Fq 'printf ' deployment/mu1440/install.sh
          ! grep -Fq 'printf ' deployment/mu1440/uninstall.sh


      - name: MU1440 shell-regression audit
        shell: bash
        run: |
          set -euxo pipefail

          # Exact vehicle evidence: external printf is absent in the direct MMX runtime.
          # Shell scripts deployed to the unit must not regress to it.
          ! grep -R -n -E '(^|[;&|[:space:]])printf[[:space:]]' deployment/mu1440 runtime modules/carplay/runtime

          # Exact vehicle evidence also showed that relying on grep A\|B alternation is unsafe.
          # Require separate fixed-string checks instead.
          ! grep -R -n -F '\|' deployment/mu1440 runtime modules/carplay/runtime

          # The prepared developer package must carry its own hash helper and must
          # not depend on the classic M.I.B. SD bootstrap/binary tree.
          grep -Fq 'SHA=${MIBR_SHA256:-$PAYLOAD/sha256sum}' deployment/mu1440/install.sh
          grep -Fq 'SHA=${MIBR_SHA256:-$PAYLOAD/sha256sum}' deployment/mu1440/uninstall.sh
          grep -Fq 'payload/sha256sum' tools/prepare_mu1440_sd.sh
          grep -Fq 'payload/tee' tools/prepare_mu1440_sd.sh
          grep -Fq 'payload/MIBR-NavIgnore.jar' tools/prepare_mu1440_sd.sh
          grep -Fq 'payload/MIBR-Most20FPS.jar' tools/prepare_mu1440_sd.sh
          grep -Fq 'check_hash "$PAYLOAD/MIBR-NavIgnore.jar" "$EXPECTED_NAVIGNORE"' deployment/mu1440/install.sh
          grep -Fq 'check_hash "$PAYLOAD/MIBR-Most20FPS.jar" "$EXPECTED_MOST20"' deployment/mu1440/install.sh
          grep -Fq 'TEE=${MIBR_TEE:-$PAYLOAD/tee}' deployment/mu1440/install.sh
          grep -Fq 'media_rw || fail "deployment_media_not_writable=$MEDIA_ROOT"' deployment/mu1440/install.sh
          grep -Fq 'TEE="$BASE/bin/tee"' modules/carplay/runtime/auto-direct/common.sh
          grep -Fq 'TEST="$MEDIA_ROOT/.mibr-altscreen-write-test.$$"' deployment/mu1440/install.sh
          grep -Fq 'TEST="$BACKUPFOLDER/.write-test-$$"' modules/carplay/runtime/auto-direct/common.sh
          grep -Fq 'echo "run-$$"' modules/carplay/runtime/auto-direct/common.sh
          grep -Fq 'deployment_media_root' deployment/mu1440/install.sh
          grep -Fq 'mount -uw "$DEPLOY_MEDIA_ROOT"' modules/carplay/runtime/auto-direct/common.sh
          grep -Fq 'DIRECT_FPS_OVERRIDE_FILE=/mnt/app/root/mibr-direct-output-fps' modules/carplay/runtime/auto-direct/common.sh
          grep -Fq 'SOURCE_FPS_OVERRIDE_FILE=/mnt/app/root/mibr-carplay111-fps' modules/carplay/runtime/auto-direct/common.sh
          grep -Fq '#define MIBR_CFG_PERSIST_ROOT "/mnt/app/root"' modules/carplay/source/altscreen111-gen2/libaltscreen111_gen2.c
          grep -Fq 'g_fps_config_name = "mibr-carplay111-fps"' modules/carplay/source/altscreen111-gen2/libaltscreen111_gen2.c
          grep -Fq 'MIBR_PACE="$DIRECT_PACE" MIBR_PACE_BUFFER="$DIRECT_PACE_BUFFER"' modules/carplay/runtime/auto-direct/direct_ts_auto_supervisor.sh
          grep -Fq 'DIRECT_FPS=SET fps=$FPS' modules/carplay/runtime/auto-direct/direct_fps.sh
          grep -Fq 'for SPEC in "NavIgnore:MIBR-NavIgnore.jar:$EXPECTED_NAVIGNORE" "Most20:MIBR-Most20FPS.jar:$EXPECTED_MOST20"; do' deployment/mu1440/install.sh
          grep -Fq 'fail "${NAME}_required expected=$EXPECT"' deployment/mu1440/install.sh
          grep -Fq 'fail "${NAME}_lsd_insertion_point_missing"' deployment/mu1440/install.sh
          grep -Fq 'fail "${NAME}_duplicate_bootclasspath_refs=$REFS"' deployment/mu1440/install.sh
          grep -Fq 'navignore_state=PASS_EXACT' deployment/mu1440/status.sh
          grep -Fq 'navignore_bootclasspath_refs=' deployment/mu1440/status.sh
          grep -Fq 'most20_state=PASS_EXACT' deployment/mu1440/status.sh
          grep -Fq 'most20_bootclasspath_refs=' deployment/mu1440/status.sh
          grep -Fq 'install_required_most20' deployment/mu1440/install.sh
          grep -Fq '/mnt/app/root/mibr-alt111-keyframe-policy.enabled' deployment/mu1440/install.sh
          grep -Fq 'vehicle-tested-2026-09-27/libmibr_isotx2_gate.so' tools/prepare_mu1440_sd.sh
          grep -Fq 'runtime/deployment/session.sh' tools/prepare_mu1440_sd.sh
          grep -Fq 'mibr_run_logged "$0" "$@"' deployment/mu1440/install.sh
          grep -Fq 'mibr_run_logged "$0" "$@"' deployment/mu1440/status.sh
          grep -Fq 'mibr_run_logged "$0" "$@"' deployment/mu1440/uninstall.sh
          grep -Fq 'mibr_vehicle_summary' deployment/mu1440/install.sh
          grep -Fq 'mibr_archive_java_state preflight-foreign' deployment/mu1440/install.sh
          grep -Fq 'MIBR_FOREIGN_JAVA_ACTION' deployment/mu1440/install.sh
          grep -Fq 'JAVA_USER_DECISION=ARCHIVE_AND_CONTINUE' deployment/mu1440/install.sh
          grep -Fq 'JAVA_USER_DECISION=ABORT' deployment/mu1440/install.sh
          grep -Fq 'Bundled exact NavIgnore payload verified before Java normalization.' deployment/mu1440/install.sh
          grep -Fq 'TMP=/tmp/lsd.sh.mibr-deploy-normalize.$' deployment/mu1440/install.sh
          grep -Fq 'VIN, FAZIT and device serial numbers are intentionally not collected.' runtime/deployment/session.sh
          grep -Fq 'mode=READ_ONLY_TARGET' deployment/mu1440/compatibility-report.sh
          grep -Fq 'writes=deployment_media_only' deployment/mu1440/compatibility-report.sh
          grep -Fq 'displaymanager.json' deployment/mu1440/compatibility-report.sh
          grep -Fq 'dio_manager.json' deployment/mu1440/compatibility-report.sh
          grep -Fq 'smartphone_integrator.json' deployment/mu1440/compatibility-report.sh
          ! grep -n -E 'mount[[:space:]]+-uw[[:space:]]+/(mnt|net/rcc)|app_rw|system_rw|(^|[;&|[:space:]])(rm|mv|chmod|slay|kill)[[:space:]]' deployment/mu1440/compatibility-report.sh
          ! grep -R -n -F '/apps/sbin' deployment/mu1440 modules/carplay/runtime/auto-direct modules/carplay/runtime/isotx2-gate modules/carplay/runtime/parity
          ! grep -R -n -F 'config/BASICS' deployment/mu1440 modules/carplay/runtime/auto-direct modules/carplay/runtime/isotx2-gate modules/carplay/runtime/parity
          ! grep -R -n -F 'apps/mounts' deployment/mu1440 modules/carplay/runtime/auto-direct modules/carplay/runtime/isotx2-gate modules/carplay/runtime/parity
          ! grep -R -n -F 'M.I.B.-style' deployment/mu1440 modules/carplay/runtime/auto-direct modules/carplay/runtime/isotx2-gate modules/carplay/runtime/parity

          # Reject accidental literal escape/newline or PID-temp regressions introduced by scripted edits.
          python3 - <<'PY'
          from pathlib import Path
          files = [
              Path("deployment/mu1440/install.sh"),
              Path("deployment/mu1440/uninstall.sh"),
              Path("deployment/mu1440/status.sh"),
              Path("deployment/mu1440/compatibility-report.sh"),
              Path("modules/carplay/runtime/auto-direct/common.sh"),
              Path("runtime/deployment/session.sh"),
              Path("tools/prepare_mu1440_sd.sh"),
          ]
          for p in files:
              s = p.read_text()
              assert '\\n' not in s, f"literal backslash-n in {p}"
          install = Path("deployment/mu1440/install.sh").read_text()
          common = Path("modules/carplay/runtime/auto-direct/common.sh").read_text()
          assert 'mibr-deploy-normalize.$"' not in install
          assert '.mibr-altscreen-write-test.$"' not in install
          assert '.write-test-$"' not in common
          assert 'echo "run-$"' not in common
          PY

          # Fail before persistent mutation if the exact mandatory runtime command set is absent.
          grep -Fq 'require_cmds mount cp mv chmod sync mkdir rm touch sleep grep awk wc cat pidin on slay /bin/sh /bin/ksh /eso/bin/apps/dmdt' deployment/mu1440/install.sh
          ! grep -R -n -E '(^|[^A-Za-z0-9_])sed([[:space:]]|$)' deployment/mu1440 modules/carplay/runtime/auto-direct modules/carplay/runtime/isotx2-gate modules/carplay/runtime/parity modules/navigation/runtime
          ! grep -R -n -E '(^|[;&|[:space:]])printf[[:space:]]' modules/navigation/runtime

          # The EEPROM hex decoder used only for issue diagnostics must be deterministic.
          bash -c '
            . runtime/deployment/session.sh
            test "$(echo "0x000003A0 4D 48 49 32 5F 45 52 5F 53 4B 47 31 33 5F 50 34 35 32 36 00" | mibr_hex_ascii)" = "MHI2_ER_SKG13_P4526"
            test "$(echo "0x000003B9 31 34 34 30" | mibr_hex_ascii)" = "1440"
          '

          # Java conflict handling must archive first and require a reachable exact
          # NavIgnore before any target-side normalization.
          python3 - <<'PY'
          from pathlib import Path
          s=Path("deployment/mu1440/install.sh").read_text()
          archive=s.index("mibr_archive_java_state preflight-foreign")
          attention=s.index("PREFLIGHT=ATTENTION java_state_requires_user_decision")
          guard=s.index("Bundled exact NavIgnore payload verified before Java normalization.")
          normalize=s.index("normalize_java_state", s.index("handle_java_conflict(){"))
          stage=s.index("stage_runtime", s.index("apply(){"))
          assert archive < attention
          assert guard < normalize
          assert normalize < stage
          PY

          # Auto-Direct must be prepared, not started, before the reboot that loads
          # the DisplayManager gate.
          grep -Fq 'MIBR_PREPARE_ONLY=1' deployment/mu1440/install.sh
          grep -Fq 'runtime_start=SKIPPED_UNTIL_REBOOT' modules/carplay/runtime/auto-direct/direct_ts_auto_enable.sh

          # Top-level installer owns the /mnt/app writable lifetime even on error.
          grep -Fq 'APP_RW=0' deployment/mu1440/install.sh
          grep -Fq 'trap cleanup 0 1 2 15' deployment/mu1440/install.sh
          grep -Fq 'app_ro' deployment/mu1440/install.sh

          # Install order: the fail-safe DisplayManager gate is installed before
          # the persistent CarPlay preload is prepared.
          python3 - <<'PY'
          from pathlib import Path
          s=Path("deployment/mu1440/install.sh").read_text()
          gate=s.index("=== install DisplayManager isoTX2 gate preload ===")
          cp=s.index("=== prepare persistent CarPlay Stream111 preload ===")
          assert gate < cp
          PY


      - name: Prepared developer directory smoke
        shell: bash
        run: |
          set -euxo pipefail
          DEST="$RUNNER_TEMP/fake-sd"
          mkdir -p "$DEST"
          echo keep > "$DEST/KEEP.ME"
          tools/prepare_mu1440_sd.sh "$DEST"

          PKG="$DEST"
          test -f "$DEST/KEEP.ME"
          test ! -e "$DEST/MHI2AltScreen"
          test -x "$PKG/install.sh"
          test -x "$PKG/uninstall.sh"
          test -x "$PKG/status.sh"
          test -x "$PKG/compatibility-report.sh"
          test -x "$PKG/payload/sha256sum"
          test -x "$PKG/payload/libaltscreen111.so"
          test -x "$PKG/payload/direct-ts-remux"
          test -x "$PKG/payload/libmibr_isotx2_gate.so"
          test -x "$PKG/payload/sha256sum"
          test -x "$PKG/payload/tee"
          test -f "$PKG/payload/MIBR-NavIgnore.jar"
          test "$(sha256sum "$PKG/payload/MIBR-NavIgnore.jar" | awk '{print $1}')" = "b065bab0e1c58f8439a3bdd73d2d4cb6060cbac1c943e5b425425eb453c94b34"
          test -f "$PKG/payload/MIBR-Most20FPS.jar"
          test "$(sha256sum "$PKG/payload/MIBR-Most20FPS.jar" | awk '{print $1}')" = "dbd45609fe4ba69948d39e9e649b224484f680f6aa7934b68c261a4d360ea5bb"
          test -x "$PKG/runtime/deployment/session.sh"
          test -x "$PKG/runtime/diagnostics/keypanel_capture.sh"
          test -x "$PKG/runtime/diagnostics/keypanel_note.sh"
          grep -Fq 'payload/tee' "$PKG/PAYLOAD.sha256"
          grep -Fq 'payload/MIBR-NavIgnore.jar' "$PKG/PAYLOAD.sha256"
          grep -Fq 'payload/MIBR-Most20FPS.jar' "$PKG/PAYLOAD.sha256"
          test -f "$PKG/PAYLOAD.sha256"

          # Stable public deployment intentionally does not ship the unvalidated
          # SafeArea candidate as its active runtime helper yet.
          test ! -e "$PKG/runtime/navigation/gen2_safearea.sh"
          test ! -e "$PKG/runtime/experimental"
          test "$(find "$PKG" -type f -name '*.jar' -print | wc -l)" = "2"
          test -f "$PKG/payload/MIBR-NavIgnore.jar"
          test -f "$PKG/payload/MIBR-Most20FPS.jar"

          (
            cd "$PKG"
            sha256sum -c PAYLOAD.sha256
            while IFS= read -r script; do
              bash -n "$script"
            done < <(find . -type f -name '*.sh' -print | sort)
          )

          # The vehicle-test ZIP is self-contained: every project-supplied payload
          # referenced by shipped shell code must exist, and the payload set is closed.
          PKG="$PKG" python3 - <<'PY'
          import os, re
          from pathlib import Path
          pkg=Path(os.environ["PKG"])
          expected={
              "libaltscreen111.so",
              "direct-ts-remux",
              "libmibr_isotx2_gate.so",
              "sha256sum",
              "tee",
              "MIBR-NavIgnore.jar",
              "MIBR-Most20FPS.jar",
          }
          actual={p.name for p in (pkg/"payload").iterdir() if p.is_file()}
          assert actual == expected, (actual, expected)
          manifest=(pkg/"PAYLOAD.sha256").read_text()
          for name in expected:
              assert f"payload/{name}" in manifest, name
          referenced=set()
          for p in [pkg/"install.sh", pkg/"status.sh", pkg/"uninstall.sh", pkg/"compatibility-report.sh", *pkg.glob("runtime/**/*.sh")]:
              s=p.read_text()
              referenced.update(re.findall(r'(?:\$PAYLOAD/|\.\./\.\./payload/)([A-Za-z0-9_.-]+)', s))
          missing=referenced-actual
          assert not missing, f"referenced payload missing from package: {sorted(missing)}"
          PY

          cat > "$RUNNER_TEMP/keypanel-sample.log" <<'EOF'
          2026-10-03T01:00:00 NOTE voice short
          j9/hmi: HK Received: KBD[4] KEY[50] KST[1]
          j9/hmi: HK Received: KBD[4] KEY[50] KST[0]
          2026-10-03T01:00:02 NOTE candidate long
          j9/hmi: HK Received: KBD[4] KEY[58] KST[1]
          j9/hmi: HK Received: KBD[4] KEY[58] KST[3]
          j9/hmi: HK Received: KBD[4] KEY[58] KST[4]
          j9/hmi: HK Received: KBD[4] KEY[58] KST[0]
          EOF
          python3 tools/parse_keypanel_trace.py "$RUNNER_TEMP/keypanel-sample.log" |
            grep -Fq 'KEY_MFW_PTT_ON'
          python3 tools/parse_keypanel_trace.py --gestures "$RUNNER_TEMP/keypanel-sample.log" |
            grep -Fq 'GESTURE=SHORT'
          python3 tools/parse_keypanel_trace.py --gestures "$RUNNER_TEMP/keypanel-sample.log" |
            grep -Fq 'GESTURE=LONG2'
          python3 tools/parse_keypanel_trace.py --gestures "$RUNNER_TEMP/keypanel-sample.log" |
            grep -Fq 'NOTE candidate long'


      - name: Keypanel discovery stays read-only
        shell: bash
        run: |
          set -euxo pipefail
          F=runtime/diagnostics/keypanel_trace_discovery.sh
          ! grep -n -E 'mount[[:space:]]+-u|(^|[;&|[:space:]])(cp|mv|rm|slay|kill|touch)[[:space:]]' "$F"
          grep -Fq 'mode=READ_ONLY' "$F"
          grep -Fq '/eso/bin/traceserver' "$F"
          grep -Fq 'logging.properties' "$F"
