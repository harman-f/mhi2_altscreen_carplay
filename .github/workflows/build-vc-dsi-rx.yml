name: Build MU1440 VC DSI receiver (R2 WIP)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/build-vc-dsi-rx.yml'
      - 'src/native/vc_trace/**'
      - 'tools/build_vc_dsi_rx.sh'
      - 'tools/prepare_vc_trace_r2.py'
      - 'tools/merge_vc_r2_timeline.py'
      - 'tests/vc-trace/**'

permissions:
  contents: read

concurrency:
  group: mu1440-vc-dsi-r2-${{ github.ref }}
  cancel-in-progress: true

env:
  TOOLCHAIN_REPO: https://github.com/luka-dev/qnx65-armv7-toolchain.git
  TOOLCHAIN_COMMIT: 56a66557245af14077678cd28a83ce3a337d9e2d
  TOOLCHAIN_DOCKERFILE_SHA256: 9a867a7ae70f2c0222a241b80232856526ccec0db2cfe013f8991ca31c74bcb1
  IMAGE: mhi2-qnx65-armv7-public:4.9

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Host strict compile + synthetic RX regression
        shell: bash
        run: |
          set -euxo pipefail
          gcc -DMIBR_HOST_TEST -O2 -std=gnu99 -Wall -Wextra -Werror \
            src/native/vc_trace/mibr_dsi_rx.c \
            -o tests/vc-trace/mibr-dsi-rx-host
          python3 tests/vc-trace/test_r2.py
          gcc -O2 -std=gnu99 -Wall -Wextra -Werror \
            src/native/vc_trace/mibr_fileeq.c -o build/vc-fileeq-host
          printf 'same\000\n' > build/vc-eq1
          cp build/vc-eq1 build/vc-eq2
          build/vc-fileeq-host build/vc-eq1 build/vc-eq2
          printf 'diff' > build/vc-eq2
          if build/vc-fileeq-host build/vc-eq1 build/vc-eq2; then exit 71; fi
          echo FILEEQ_HOST=PASS
          python3 -m py_compile tools/prepare_vc_trace_r2.py tools/merge_vc_r2_timeline.py
          bash -n tools/build_vc_dsi_rx.sh
      - name: Build pinned QNX ARMv7 toolchain
        shell: bash
        run: |
          set -euxo pipefail
          git clone "$TOOLCHAIN_REPO" "$RUNNER_TEMP/qnx-toolchain"
          git -C "$RUNNER_TEMP/qnx-toolchain" checkout "$TOOLCHAIN_COMMIT"
          test "$(sha256sum "$RUNNER_TEMP/qnx-toolchain/Dockerfile" | awk '{print $1}')" = \
            "$TOOLCHAIN_DOCKERFILE_SHA256"
          python3 - "$RUNNER_TEMP/qnx-toolchain/Dockerfile" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          s = p.read_text()
          needle = "RUN dpkg --add-architecture i386 && apt-get update && \\\n"
          replacement = (
              "RUN sed -i 's#http://deb.debian.org/debian-security#"
              "http://snapshot.debian.org/archive/debian-security/20260903T220410Z#g' "
              "/etc/apt/sources.list && \\\n"
              "    echo 'Acquire::Check-Valid-Until \"false\";' "
              "> /etc/apt/apt.conf.d/99snapshot && \\\n"
              "    dpkg --add-architecture i386 && apt-get update && \\\n"
          )
          if needle not in s:
              raise SystemExit("qnx-sdp apt bootstrap anchor not found")
          p.write_text(s.replace(needle, replacement, 1))
          PY
          docker buildx build \
            --platform=linux/amd64 --target base-env --build-arg BASE=base-4.9 \
            --cache-from type=gha --cache-to type=gha,mode=max --load \
            -t "$IMAGE" "$RUNNER_TEMP/qnx-toolchain"
      - name: Build and inspect QNX binary
        shell: bash
        run: |
          set -euxo pipefail
          docker run --rm --platform=linux/amd64 \
            -v "$PWD:/src" -w /src "$IMAGE" \
            sh tools/build_vc_dsi_rx.sh build/vc-dsi-rx
          sudo chown -R "$(id -u):$(id -g)" build/vc-dsi-rx
          file build/vc-dsi-rx/mibr-dsi-rx | tee build/vc-dsi-rx/file.txt
          docker run --rm --platform=linux/amd64 \
            -v "$PWD:/src" -w /src "$IMAGE" \
            arm-unknown-nto-qnx6.5.0eabi-readelf -h build/vc-dsi-rx/mibr-dsi-rx \
            > build/vc-dsi-rx/ELF.txt
          docker run --rm --platform=linux/amd64 \
            -v "$PWD:/src" -w /src "$IMAGE" \
            arm-unknown-nto-qnx6.5.0eabi-readelf -d build/vc-dsi-rx/mibr-dsi-rx \
            > build/vc-dsi-rx/NEEDED.txt
          grep -Eq 'Machine:.*ARM' build/vc-dsi-rx/ELF.txt
          grep -Eq 'Class:.*ELF32' build/vc-dsi-rx/ELF.txt
          grep -Eq 'ELF 32-bit.*ARM' build/vc-dsi-rx/file.txt
          file build/vc-dsi-rx/mibr-fileeq | tee build/vc-dsi-rx/fileeq-file.txt
          docker run --rm --platform=linux/amd64 \
            -v "$PWD:/src" -w /src "$IMAGE" \
            arm-unknown-nto-qnx6.5.0eabi-readelf -h build/vc-dsi-rx/mibr-fileeq \
            > build/vc-dsi-rx/fileeq-ELF.txt
          grep -Eq 'Machine:.*ARM' build/vc-dsi-rx/fileeq-ELF.txt
          grep -Eq 'Class:.*ELF32' build/vc-dsi-rx/fileeq-ELF.txt
          (cd build/vc-dsi-rx && sha256sum mibr-dsi-rx mibr-fileeq > SHA256SUMS.txt)
      - name: Upload research-only QNX artifact (NOT installation-ready)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mibr-vc-dsi-rx-R2-QNX65-ARMv7-WIP
          path: |
            build/vc-dsi-rx/mibr-dsi-rx
            build/vc-dsi-rx/mibr-fileeq
            build/vc-dsi-rx/file.txt
            build/vc-dsi-rx/ELF.txt
            build/vc-dsi-rx/NEEDED.txt
            build/vc-dsi-rx/SHA256SUMS.txt
            build/vc-dsi-rx/fileeq-file.txt
            build/vc-dsi-rx/fileeq-ELF.txt
          if-no-files-found: error
