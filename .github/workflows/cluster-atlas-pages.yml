name: MIB Atlas static-site validation and Pages deployment

on:
  pull_request:
    paths:
      - docs/index.html
      - docs/atlas/**
      - tools/docs/check_cluster_atlas.py
      - .github/workflows/cluster-atlas-pages.yml
  push:
    branches: [main]
    paths:
      - docs/index.html
      - docs/atlas/**
      - tools/docs/check_cluster_atlas.py
      - .github/workflows/cluster-atlas-pages.yml
  # Re-run by configurator-pages-refresh.yml (on develop) after configurator changes.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check topic tabs, matrix, profiles, links and privacy
        run: python3 -B tools/docs/check_cluster_atlas.py docs/index.html

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: cluster-atlas-pages
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check out develop for the configurator
        uses: actions/checkout@v4
        with:
          ref: develop
          path: _develop
          persist-credentials: false
      - name: Stage standalone public HTML only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _atlas_site/configurator
          cp docs/index.html _atlas_site/index.html
          # Configurator: single self-contained HTML from the develop tip.
          # Runs fully in the browser; projects are saved locally, never uploaded.
          cp _develop/tools/menu-editor/mibr-menu-editor-nav-views-mockup.html _atlas_site/configurator/index.html
          echo "configurator from develop @ $(git -C _develop rev-parse --short HEAD)"
          touch _atlas_site/.nojekyll
          test -s _atlas_site/index.html
          test -s _atlas_site/configurator/index.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          # On re-run, artifacts from earlier attempts are retained by GitHub.
          # Attempt-specific names avoid ambiguous duplicate `github-pages` uploads.
          name: github-pages-${{ github.run_attempt }}
          path: _atlas_site
          include-hidden-files: true
      - name: Wait until GitHub Actions lists the uploaded Pages artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT: github-pages-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          # Upload finalization can precede the REST artifact-list visibility.
          # Deploy-pages looks up by name and otherwise returns a transient zero-artifact error.
          for check in {1..15}; do
            if gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" --jq '.artifacts[].name' | grep -Fxq "$PAGES_ARTIFACT"; then
              echo "Pages artifact ready: $PAGES_ARTIFACT"
              exit 0
            fi
            sleep 3
          done
          echo '::error::Uploaded Pages artifact not visible in Actions after bounded retries'
          exit 1
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
