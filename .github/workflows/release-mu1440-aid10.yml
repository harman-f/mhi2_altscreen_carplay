# Historical entrypoint retained for traceability.
# The dev-current GitHub Release was withdrawn on 2026-10-26.
# This workflow must never assemble, upload, replace or delete any artifact/tag.
name: Retired MU1440 developer publisher (no release)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    name: Legacy developer publisher retired
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: No publication by design
        shell: bash
        run: |
          echo 'The historical mu1440-aid10-dev-current publisher is retired.'
          echo 'No tag, asset, release, installer, Unit or vehicle operation is performed.'
          echo 'Use a separately reviewed immutable versioned product pipeline.'
