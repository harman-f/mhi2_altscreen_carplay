name: Release readiness - canonical modules and QNX shell safety

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/release-mu1440-aid10.yml'
      - '.github/workflows/publication-audit.yml'
      - 'release/**'
      - 'deployment/mu1440/**'
      - 'modules/**'
      - 'settings/**'
      - 'runtime/diagnostics/**'
      - 'runtime/deployment/**'
      - 'tools/release/**'
      - 'tools/prepare_mu1440_sd.sh'
      - 'tools/check_mu1440_target_shell.py'
      - 'tools/check_module_index.py'
      - 'tools/validate_modular_package.py'
      - 'tools/build_*.sh'
      - 'artifacts/mu1440/**'
  push:
    branches: [ main, develop ]
    paths:
      - '.github/workflows/release-mu1440-aid10.yml'
      - '.github/workflows/publication-audit.yml'
      - 'release/**'
      - 'deployment/mu1440/**'
      - 'modules/**'
      - 'settings/**'
      - 'runtime/diagnostics/**'
      - 'runtime/deployment/**'
      - 'tools/release/**'
      - 'tools/prepare_mu1440_sd.sh'
      - 'tools/check_mu1440_target_shell.py'
      - 'tools/check_module_index.py'
      - 'tools/validate_modular_package.py'
      - 'tools/build_*.sh'
      - 'artifacts/mu1440/**'

permissions:
  contents: read

concurrency:
  group: mu1440-aid10-package-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  ZIP_NAME: MHI2_AltScreen_MU1440_AID10_LEGACY_CI_ONLY.zip

jobs:
  plan:
    name: Derive module impact and review release ownership
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Plan all three normal beta profiles (host only)
        shell: bash
        run: python3 tools/release/plan_multi_profile_beta.py --self-test --json-out beta-profiles.json

      - name: Build owner/dependency plan (host only)
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python3 tools/release/module_plan.py --self-test
          python3 tools/check_module_index.py --self-test
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" || -z "$BASE_SHA" || "$BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            python3 tools/release/module_plan.py --all --json-out release-module-plan.json
          else
            python3 tools/release/module_plan.py --base "$BASE_SHA" --head "$HEAD_SHA" --json-out release-module-plan.json
          fi

      - name: Upload release dependency plan (not a package)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: multi-profile-beta-release-plan
          path: |
            release-module-plan.json
            beta-profiles.json
          if-no-files-found: error
          retention-days: 14

  legacy:
    name: Legacy MU1440 compatibility ZIP integrity (R3 publish blocked)
    needs: plan
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Final release audit
        shell: bash
        run: |
          set -euxo pipefail
          # Release packages use pinned existing binaries; source builds have separate CI.
          python3 tools/check_module_index.py --self-test
          python3 tools/validate_modular_package.py --self-test
          python3 tools/release/qnx_scripts.py --self-test --canonical
          python3 tools/release/audit_legacy.py --self-test
          test -s modules/carplay/runtime/auto-direct/common.sh
          test -s modules/carplay/runtime/isotx2-gate/install_preload.sh
          test -s modules/carplay/runtime/parity/parity_session.sh
          test -s modules/navigation/runtime/gen2_nav_config.sh
          test -s runtime/deployment/session.sh

          test "$(sha256sum artifacts/mu1440/altscreen111/vehicle-tested-2026-09-27/libaltscreen111.so | awk '{print $1}')" = \
            "094e3f1abfbf949f8c11b27e048e8213e5fc71178e62efd3c56deed8ee3bf8d8"
          test "$(sha256sum artifacts/mu1440/direct-ts-remux/vehicle-tested-2026-09-27/direct-ts-remux | awk '{print $1}')" = \
            "b761a8741682e3cbc6e05f5fe1705475c34c4805d1cd1ce09333274a301e735e"
          test "$(sha256sum artifacts/mu1440/isotx2-gate/vehicle-tested-2026-09-27/libmibr_isotx2_gate.so | awk '{print $1}')" = \
            "05673010a88c25022145ffb4e75d3715eaf686f4127ac188e91a52f512b9d957"
          test "$(sha256sum artifacts/mu1440/navignore/vehicle-tested-2026-09-27/MIBR-NavIgnore.jar | awk '{print $1}')" = \
            "b065bab0e1c58f8439a3bdd73d2d4cb6060cbac1c943e5b425425eb453c94b34"
          test "$(sha256sum artifacts/mu1440/most20fps/vehicle-tested-2026-09-29/MIBR-Most20FPS.jar | awk '{print $1}')" = \
            "dbd45609fe4ba69948d39e9e649b224484f680f6aa7934b68c261a4d360ea5bb"
          # These helpers are build-confirmed, not the historical vehicle-pinned media binaries.
          # Verify their checked-in SHA manifests instead of stale constant digests.
          (cd artifacts/mu1440/sha256sum-compat/build-confirmed-current && sha256sum -c sha256sum.sha256)
          (cd artifacts/mu1440/tee-compat/build-confirmed-current && sha256sum -c tee.sha256)

          grep -Fq 'EXPECTED_GEN2=094e3f1abfbf949f8c11b27e048e8213e5fc71178e62efd3c56deed8ee3bf8d8' deployment/mu1440/install.sh
          grep -Fq 'EXPECTED_REMUX=b761a8741682e3cbc6e05f5fe1705475c34c4805d1cd1ce09333274a301e735e' deployment/mu1440/install.sh
          grep -Fq 'EXPECTED_GATE=05673010a88c25022145ffb4e75d3715eaf686f4127ac188e91a52f512b9d957' deployment/mu1440/install.sh
          grep -Fq 'EXPECTED_NAVIGNORE=b065bab0e1c58f8439a3bdd73d2d4cb6060cbac1c943e5b425425eb453c94b34' deployment/mu1440/install.sh
          grep -Fq 'EXPECTED_MOST20=dbd45609fe4ba69948d39e9e649b224484f680f6aa7934b68c261a4d360ea5bb' deployment/mu1440/install.sh
          grep -Fq 'EXPECTED_LSD_JXE=a55d9cfb69c5756f8202b7f7aa4079d4d5b637ae4c2fd0fe723f1d6816cbeea8' deployment/mu1440/install.sh
          grep -Fq 'check_hash "$PAYLOAD/MIBR-NavIgnore.jar" "$EXPECTED_NAVIGNORE"' deployment/mu1440/install.sh
          grep -Fq 'check_hash "$PAYLOAD/MIBR-Most20FPS.jar" "$EXPECTED_MOST20"' deployment/mu1440/install.sh

          grep -Fq 'mibr_run_logged "$0" "$@"' deployment/mu1440/install.sh
          grep -Fq 'mibr_run_logged "$0" "$@"' deployment/mu1440/status.sh
          grep -Fq 'mibr_run_logged "$0" "$@"' deployment/mu1440/uninstall.sh
          grep -Fq 'mibr_archive_java_state preflight-foreign' deployment/mu1440/install.sh
          grep -Fq 'JAVA_USER_DECISION=ARCHIVE_AND_CONTINUE' deployment/mu1440/install.sh
          grep -Fq 'JAVA_USER_DECISION=ABORT' deployment/mu1440/install.sh
          grep -Fq 'validated_reference_target=MHI2_ER_SKG13_P4526_MU1440' runtime/deployment/session.sh
          grep -Fq 'mode=READ_ONLY_TARGET' deployment/mu1440/compatibility-report.sh
          grep -Fq 'writes=deployment_media_only' deployment/mu1440/compatibility-report.sh

          grep -Fq 'TEST="$MEDIA_ROOT/.mibr-altscreen-write-test.$$"' deployment/mu1440/install.sh
          grep -Fq 'TEST="$BACKUPFOLDER/.write-test-$$"' modules/carplay/runtime/auto-direct/common.sh
          grep -Fq 'mount -uw "$DEPLOY_MEDIA_ROOT"' modules/carplay/runtime/auto-direct/common.sh
          grep -Fq 'payload/tee' tools/prepare_mu1440_sd.sh
          grep -Fq 'payload/MIBR-NavIgnore.jar' tools/prepare_mu1440_sd.sh
          grep -Fq 'payload/MIBR-Most20FPS.jar' tools/prepare_mu1440_sd.sh
          grep -Fq 'vehicle-tested-2026-09-27/libmibr_isotx2_gate.so' tools/prepare_mu1440_sd.sh

          ! grep -R -n -F '/apps/sbin' deployment/mu1440 modules/carplay/runtime/auto-direct modules/carplay/runtime/isotx2-gate modules/carplay/runtime/parity
          ! grep -R -n -F 'config/BASICS' deployment/mu1440 modules/carplay/runtime/auto-direct modules/carplay/runtime/isotx2-gate modules/carplay/runtime/parity
          ! grep -R -n -F 'apps/mounts' deployment/mu1440 modules/carplay/runtime/auto-direct modules/carplay/runtime/isotx2-gate modules/carplay/runtime/parity
          ! grep -R -n -E '(^|[^A-Za-z0-9_])sed([[:space:]]|$)' deployment/mu1440 modules/carplay/runtime/auto-direct modules/carplay/runtime/isotx2-gate modules/carplay/runtime/parity modules/navigation/runtime
          ! grep -R -n -E '(^|[;&|[:space:]])printf[[:space:]]' modules/navigation/runtime
          ! grep -R -n -E '(^|[;&|[:space:]])printf[[:space:]]' deployment/mu1440 runtime modules/carplay/runtime

      - name: Assemble self-contained SD-root package
        shell: bash
        run: |
          set -euxo pipefail
          PKG="$RUNNER_TEMP/pkg"
          mkdir -p "$PKG"
          tools/prepare_mu1440_sd.sh "$PKG"
          # Validate exactly the shipped scripts, not only their source folders.
          python3 tools/release/qnx_scripts.py --package-root "$PKG"

          test -x "$PKG/install.sh"
          test -x "$PKG/status.sh"
          test -x "$PKG/uninstall.sh"
          test -x "$PKG/compatibility-report.sh"
          test -x "$PKG/runtime/deployment/session.sh"
          test -f "$PKG/PAYLOAD.sha256"
          test ! -e "$PKG/MHI2AltScreen"
          test ! -e "$PKG/esd"
          test ! -e "$PKG/runtime/navigation/gen2_safearea.sh"
          test ! -e "$PKG/runtime/experimental"

          test "$(find "$PKG/payload" -maxdepth 1 -type f | wc -l)" = "7"
          test -f "$PKG/payload/MIBR-NavIgnore.jar"
          test -f "$PKG/payload/MIBR-Most20FPS.jar"
          test "$(sha256sum "$PKG/payload/MIBR-NavIgnore.jar" | awk '{print $1}')" = \
            "b065bab0e1c58f8439a3bdd73d2d4cb6060cbac1c943e5b425425eb453c94b34"
          test "$(sha256sum "$PKG/payload/MIBR-Most20FPS.jar" | awk '{print $1}')" = \
            "dbd45609fe4ba69948d39e9e649b224484f680f6aa7934b68c261a4d360ea5bb"

          (
            cd "$PKG"
            sha256sum -c PAYLOAD.sha256
            while IFS= read -r script; do
              bash -n "$script"
            done < <(find . -type f -name '*.sh' -print | sort)
          )

          PKG="$PKG" python3 - <<'PY'
          import os, re
          from pathlib import Path
          pkg=Path(os.environ["PKG"])
          expected={
              "libaltscreen111.so",
              "direct-ts-remux",
              "libmibr_isotx2_gate.so",
              "sha256sum",
              "tee",
              "MIBR-NavIgnore.jar",
              "MIBR-Most20FPS.jar",
          }
          actual={p.name for p in (pkg/"payload").iterdir() if p.is_file()}
          assert actual == expected, (actual, expected)
          manifest=(pkg/"PAYLOAD.sha256").read_text()
          for name in expected:
              assert f"payload/{name}" in manifest, name
          referenced=set()
          for p in [pkg/"install.sh", pkg/"status.sh", pkg/"uninstall.sh", pkg/"compatibility-report.sh", *pkg.glob("runtime/**/*.sh")]:
              s=p.read_text()
              referenced.update(re.findall(r'(?:\\$PAYLOAD/|\\.\\./\\.\\./payload/)([A-Za-z0-9_.-]+)', s))
          assert not (referenced-actual), sorted(referenced-actual)
          PY

          cat > "$PKG/README-FIRST.txt" <<'EOF'
          MHI2 AltScreen CarPlay — current MU1440 / AID10-class developer test
          ===================================================================

          VEHICLE-TESTED REFERENCE TARGET:
            MHI2_ER_SKG13_P4526_MU1440
            LSD/J9 hash: a55d9cfb69c5756f8202b7f7aa4079d4d5b637ae4c2fd0fe723f1d6816cbeea8
            10.x-inch MQB Virtual Cockpit / project shorthand: AID10-class

          NOT validated for 12.3-inch AID or other cluster generations.

          THIS ZIP IS SELF-CONTAINED FOR THE VALIDATED TEST PATH.
          Included payload:
            libaltscreen111.so
            direct-ts-remux
            libmibr_isotx2_gate.so
            sha256sum
            tee
            MIBR-NavIgnore.jar
            MIBR-Most20FPS.jar

          NavIgnore SHA-256:
            b065bab0e1c58f8439a3bdd73d2d4cb6060cbac1c943e5b425425eb453c94b34
          Most20FPS SHA-256:
            dbd45609fe4ba69948d39e9e649b224484f680f6aa7934b68c261a4d360ea5bb

          No additional project payload needs to be downloaded before testing.

          SOURCE-DEFINED CONFIGURATION DEFAULTS (MU1440 reference, not live readback):
            CarPlay auxiliary video: enabled (carplay.enabled=1 in registry)
            Phone route arrows: disabled by default (carplay_nav=off)
            Arrow source: auto; display: side (preconfigured while arrows remain off)
            Navigation composition after installer apply: map-rich
            DisplayManager gate: STOCK fail-safe
            Auto-Direct: persistent setup prepared; verify after reboot
            D2 keyframe policy: persistent; 1000 ms watchdog and minimum request gap
            Default menu definition in source: brand=skoda

          The full 48-key registry and 13 broker-switch matrix, including apply timing,
          is maintained in docs/configuration/DEFAULT_CONFIGURATION_MATRIX.md in the
          source repository. The beta's future single-ZIP installer must include both
          this detailed matrix and a profile-specific default/override summary.
          This legacy CI package is not a complete multi-firmware beta release.

          EXISTING JAVA PATCHES:
          If a foreign/older Java or bootclasspath state is found, --check archives it on the
          SD card and reports PREFLIGHT=ATTENTION. During --apply you choose:
            C = keep the SD recovery archive, normalize the conflicting Java state and continue
            Q = abort without changing target-side Java state

          SafeArea/ViewArea experimental helpers are intentionally NOT part of the current validated ZIP.

          Copy/extract the ZIP contents directly to the SD-card root.

          UNKNOWN / UNVALIDATED TARGET:
            ./compatibility-report.sh

          This collector is read-only on the vehicle filesystems. It writes only to the SD/USB
          medium and collects train/MU, component hashes, relevant runtime observations and stock
          displaymanager/dio_manager/smartphone_integrator configs.

          VALIDATED TARGET INSTALL:
            ./install.sh --check
            ./install.sh --apply
            reboot
            ./status.sh

          LOGGING:
          compatibility-report.sh, install.sh, status.sh and uninstall.sh write complete session output plus a sanitized
          vehicle/firmware summary to mhi2-altscreen-logs/ on the SD card.
          For public Issues, attach session.log + vehicle-summary.txt.
          archive/ may contain copied third-party/OEM JAR bytes; review it before sharing.

          The DisplayManager gate defaults to STOCK.
          Most20 is enabled by default. The D2 keyframe policy is persistent by default (1 s watchdog / 1 s minimum request gap).
          EOF

          {
            echo "release_status=NOT_DISTRIBUTABLE_R3_PACKAGE_MISSING"
            echo "packaging_commit=$GITHUB_SHA"
            echo "build_kind=legacy_pinned_artifact_compatibility_audit"
            echo "target=MHI2_ER_SKG13_P4526_MU1440"
            echo "cluster=AID10-class"
            echo "deployment_generation=current_self_contained"
            echo "gen2_sha256=094e3f1abfbf949f8c11b27e048e8213e5fc71178e62efd3c56deed8ee3bf8d8"
            echo "direct_ts_remux_sha256=b761a8741682e3cbc6e05f5fe1705475c34c4805d1cd1ce09333274a301e735e"
            echo "isotx2_gate_sha256=05673010a88c25022145ffb4e75d3715eaf686f4127ac188e91a52f512b9d957"
            echo "navignore_sha256=b065bab0e1c58f8439a3bdd73d2d4cb6060cbac1c943e5b425425eb453c94b34"
            echo "most20_sha256=dbd45609fe4ba69948d39e9e649b224484f680f6aa7934b68c261a4d360ea5bb"
            echo "sha256sum_helper_sha256=$(sha256sum artifacts/mu1440/sha256sum-compat/build-confirmed-current/sha256sum | awk '{print $1}')"
            echo "tee_helper_sha256=$(sha256sum artifacts/mu1440/tee-compat/build-confirmed-current/tee | awk '{print $1}')"
          } > "$PKG/RELEASE-MANIFEST.txt"

          (
            cd "$PKG"
            sha256sum $(find . -type f ! -name RELEASE-SHA256SUMS.txt -print | sort) > RELEASE-SHA256SUMS.txt
            zip -9 -r "$GITHUB_WORKSPACE/$ZIP_NAME" .
          )
          unzip -t "$ZIP_NAME"
          python3 tools/release/audit_legacy.py "$ZIP_NAME"
          sha256sum "$ZIP_NAME" > "$ZIP_NAME.sha256"

      - name: Enforce modular release publication boundary
        shell: bash
        run: |
          set -euxo pipefail
          # The frozen SD-root developer compatibility archive is NOT the R3
          # common/profiles/source distribution. This check must not be reused
          # as a positive release gate or as permission to upload a ZIP.
          if python3 tools/validate_modular_package.py "$ZIP_NAME" 2> "$RUNNER_TEMP/r3-rejection.log"; then
            echo "Unexpectedly accepted legacy flat package as modular R3" >&2
            exit 1
          fi
          grep -Fq 'unsafe archive path' "$RUNNER_TEMP/r3-rejection.log"
          sha256sum -c "$ZIP_NAME.sha256"
          echo "LEGACY_COMPATIBILITY_AUDIT=PASS"
          echo "R3_MODULAR_RELEASE=BLOCKED"
          echo "No ZIP artifact or GitHub Release is uploaded by this workflow."
