name: Owned SEAT scroll indicator
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Host regression
        shell: bash
        run: |
          set -euxo pipefail
          python3 -B tests/test_owned_scroll_indicator.py
