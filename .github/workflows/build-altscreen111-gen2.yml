name: Build experimental GEN2 AltScreen

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/build-altscreen111-gen2.yml'
      - 'modules/carplay/source/altscreen111-gen2/**'
      - 'modules/carplay/source/alt111-settings/**'
      - 'modules/carplay/source/vehicle-data/**'
      - 'modules/carplay/source/sha256sum-compat/**'
      - 'settings/**'
      - 'tools/build_altscreen111_gen2.sh'
      - 'tools/ci_qnx65_image.sh'
      - 'tools/qnx65-image.lock'
      - 'tools/build_alt111_settings.sh'
      - 'tools/generate_alt111_settings.py'
      - 'tools/test_installed_gen2_host.sh'
      - 'tests/test_three_views.c'
      - 'tests/test_vdata.c'
      - 'tests/test_vstatus.c'
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-altscreen111-gen2.yml'
      - 'modules/carplay/source/altscreen111-gen2/**'
      - 'modules/carplay/source/alt111-settings/**'
      - 'modules/carplay/source/vehicle-data/**'
      - 'modules/carplay/source/sha256sum-compat/**'
      - 'settings/**'
      - 'tools/build_altscreen111_gen2.sh'
      - 'tools/ci_qnx65_image.sh'
      - 'tools/qnx65-image.lock'
      - 'tools/build_alt111_settings.sh'
      - 'tools/generate_alt111_settings.py'
      - 'tools/test_installed_gen2_host.sh'
      - 'tests/test_three_views.c'
      - 'tests/test_vdata.c'
      - 'tests/test_vstatus.c'

permissions:
  contents: read
  packages: read

concurrency:
  group: public-gen2-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TOOLCHAIN_REPO: https://github.com/luka-dev/qnx65-armv7-toolchain.git
  TOOLCHAIN_COMMIT: 56a66557245af14077678cd28a83ce3a337d9e2d
  TOOLCHAIN_DOCKERFILE_SHA256: 9a867a7ae70f2c0222a241b80232856526ccec0db2cfe013f8991ca31c74bcb1
  IMAGE: mhi2-qnx65-armv7-public:4.9

jobs:
  build:
    name: Build GEN2 AltScreen (QNX)
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run installed-source host fixtures
        shell: bash
        run: |
          set -euxo pipefail
          python3 tools/generate_alt111_settings.py --check
          bash tools/test_installed_gen2_host.sh

      - name: Select verified QNX 6.5 ARMv7 image
        shell: bash
        env:
          QNX65_GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          bash tools/ci_qnx65_image.sh
      - name: Build public GEN2 source
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build/gen2
          docker run --rm --platform=linux/amd64             -v "$PWD:/src" -w /src "$IMAGE"             bash -c 'QCC=arm-unknown-nto-qnx6.5.0eabi-gcc bash ./tools/build_altscreen111_gen2.sh build/gen2/libaltscreen111.so'
          sudo chown -R "$(id -u):$(id -g)" build/gen2
          cp "$QNX_TOOLCHAIN_PROVENANCE" build/gen2/QNX_TOOLCHAIN_PROVENANCE.txt

      - name: Validate developer ELF
        shell: bash
        run: |
          set -euxo pipefail
          BIN=build/gen2/libaltscreen111.so
          file "$BIN" | tee build/gen2/FILE.txt
          docker run --rm --platform=linux/amd64 -v "$PWD:/src" -w /src "$IMAGE"             /usr/bin/readelf -h "$BIN" > build/gen2/ELF_HEADER.txt
          docker run --rm --platform=linux/amd64 -v "$PWD:/src" -w /src "$IMAGE"             /usr/bin/readelf -S "$BIN" > build/gen2/SECTIONS.txt
          docker run --rm --platform=linux/amd64 -v "$PWD:/src" -w /src "$IMAGE"             /usr/bin/readelf -Ws "$BIN" > build/gen2/SYMBOLS.txt

          grep -q 'Machine:.*ARM' build/gen2/ELF_HEADER.txt
          grep -q '\.symtab' build/gen2/SECTIONS.txt
          grep -q '\.debug_info' build/gen2/SECTIONS.txt
          strings "$BIN" | grep -Fq 'GEN2 candidate active'
          strings "$BIN" | grep -Fq 'maps:/car/instrumentcluster'
          strings "$BIN" | grep -Fq 'forceKeyFrame'
          strings "$BIN" | grep -Fq 'mibr-carplay111-nav.conf'
          strings "$BIN" | grep -Fq 'showSpeedLimit=%s&showCompass=%s&showETA=%s&maneuverLayout=%s'
          strings "$BIN" | grep -Fq 'mibr-carplay111-viewareas.conf'
          strings "$BIN" | grep -Fq 'GEN2 RESYNC ARM'
          strings "$BIN" | grep -Fq 'mibr-carplay111-keyframes.conf'
          strings "$BIN" | grep -Fq 'vstatus_poll'
          sha256sum "$BIN" > build/gen2/libaltscreen111.so.sha256

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: experimental-gen2-public-rebuild
          path: |
            build/gen2/libaltscreen111.so
            build/gen2/libaltscreen111.so.sha256
            build/gen2/FILE.txt
            build/gen2/ELF_HEADER.txt
            build/gen2/SECTIONS.txt
            build/gen2/SYMBOLS.txt
            build/gen2/QNX_TOOLCHAIN_PROVENANCE.txt
