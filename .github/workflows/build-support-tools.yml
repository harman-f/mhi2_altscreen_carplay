name: Build MU1440 support tools

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/build-support-tools.yml'
      - 'src/native/isotx2-gate/**'
      - 'src/native/most-ts-writer/**'
      - 'src/native/sha256sum-compat/**'
      - 'src/native/tee-compat/**'
      - 'src/native/qnx-shmem-probe/**'
      - 'src/native/qnx-bound-process-probe/**'
      - 'tools/build_support_tools.sh'
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-support-tools.yml'
      - 'src/native/isotx2-gate/**'
      - 'src/native/most-ts-writer/**'
      - 'src/native/sha256sum-compat/**'
      - 'src/native/tee-compat/**'
      - 'tools/build_support_tools.sh'

permissions:
  contents: write

concurrency:
  group: public-support-tools
  cancel-in-progress: true

env:
  TOOLCHAIN_REPO: https://github.com/luka-dev/qnx65-armv7-toolchain.git
  TOOLCHAIN_COMMIT: 56a66557245af14077678cd28a83ce3a337d9e2d
  TOOLCHAIN_DOCKERFILE_SHA256: 9a867a7ae70f2c0222a241b80232856526ccec0db2cfe013f8991ca31c74bcb1
  IMAGE: mhi2-qnx65-armv7-public:4.9

jobs:
  build:
    name: Build support tools (QNX)
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Host-test gate semantics
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build/host-gate

          gcc -shared -fPIC -O2 -g -Wall -Wextra -pthread -ldl \
            src/native/isotx2-gate/isotx2_gate.c \
            -o build/host-gate/libmibr_isotx2_gate.so

          gcc -O2 -g -Wall -Wextra \
            src/native/isotx2-gate/gate_selftest.c \
            -o build/host-gate/gate_selftest

          TARGET="$RUNNER_TEMP/isotx2-test-target"
          rm -f \
            /tmp/mibr-isotx2-gate.direct \
            /tmp/mibr-isotx2-gate.reset \
            /tmp/mibr-isotx2-gate.stats \
            /tmp/mibr-isotx2-gate.log \
            "$TARGET"

          MIBR_ISOTX2_GATE_TARGET="$TARGET" \
            LD_PRELOAD="$PWD/build/host-gate/libmibr_isotx2_gate.so" \
            build/host-gate/gate_selftest "$TARGET"
          test "$(stat -c %s "$TARGET")" = "6"

          : > /tmp/mibr-isotx2-gate.direct
          : > "$TARGET"

          MIBR_ISOTX2_GATE_TARGET="$TARGET" \
            LD_PRELOAD="$PWD/build/host-gate/libmibr_isotx2_gate.so" \
            build/host-gate/gate_selftest "$TARGET"
          test "$(stat -c %s "$TARGET")" = "0"
          grep -q '^dropped_writev_calls=1$' /tmp/mibr-isotx2-gate.stats
          grep -q '^dropped_bytes=6$' /tmp/mibr-isotx2-gate.stats

      - name: Host-test SHA-256 compatibility helper
        shell: bash
        run: |
          set -euxo pipefail
          gcc -O2 -g -std=gnu99 -Wall -Wextra \
            src/native/sha256sum-compat/sha256sum_compat.c \
            -o "$RUNNER_TEMP/sha256sum-compat-host"
          printf abc > "$RUNNER_TEMP/sha256-abc"
          "$RUNNER_TEMP/sha256sum-compat-host" "$RUNNER_TEMP/sha256-abc" | \
            grep -Fq 'ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad'

      - name: Host-test tee compatibility helper
        shell: bash
        run: |
          set -euxo pipefail
          gcc -O2 -g -std=gnu99 -Wall -Wextra \
            src/native/tee-compat/tee_compat.c \
            -o "$RUNNER_TEMP/tee-compat-host"
          printf 'one\n' | "$RUNNER_TEMP/tee-compat-host" "$RUNNER_TEMP/tee-log" > "$RUNNER_TEMP/tee-stdout"
          printf 'two\n' | "$RUNNER_TEMP/tee-compat-host" -i -a "$RUNNER_TEMP/tee-log" >> "$RUNNER_TEMP/tee-stdout"
          test "$(cat "$RUNNER_TEMP/tee-log")" = "$(printf 'one\ntwo')"
          test "$(cat "$RUNNER_TEMP/tee-stdout")" = "$(printf 'one\ntwo')"

      - name: Build pinned public QNX 6.5 ARMv7 toolchain image
        shell: bash
        run: |
          set -euxo pipefail
          git clone "$TOOLCHAIN_REPO" "$RUNNER_TEMP/qnx-toolchain"
          git -C "$RUNNER_TEMP/qnx-toolchain" checkout "$TOOLCHAIN_COMMIT"

          test "$(sha256sum "$RUNNER_TEMP/qnx-toolchain/Dockerfile" | awk '{print $1}')" = \
            "$TOOLCHAIN_DOCKERFILE_SHA256"

          python3 - "$RUNNER_TEMP/qnx-toolchain/Dockerfile" <<'PY'
          from pathlib import Path
          import sys

          p = Path(sys.argv[1])
          s = p.read_text()
          needle = "RUN dpkg --add-architecture i386 && apt-get update && \\\n"
          replacement = (
              "RUN sed -i 's#http://deb.debian.org/debian-security#"
              "http://snapshot.debian.org/archive/debian-security/20260903T220410Z#g' "
              "/etc/apt/sources.list && \\\n"
              "    echo 'Acquire::Check-Valid-Until \"false\";' "
              "> /etc/apt/apt.conf.d/99snapshot && \\\n"
              "    dpkg --add-architecture i386 && apt-get update && \\\n"
          )
          if needle not in s:
              raise SystemExit("qnx-sdp apt bootstrap anchor not found")
          s = s.replace(needle, replacement, 1)
          gcc_url = "https://ftp.gnu.org/gnu/gcc/gcc-${GCC49_VER}/gcc-${GCC49_VER}.tar.bz2"
          gcc_mirror = "https://ftpmirror.gnu.org/gcc/gcc-${GCC49_VER}/gcc-${GCC49_VER}.tar.bz2"
          if gcc_url not in s:
              raise SystemExit("gcc-4.9 download anchor not found")
          p.write_text(s.replace(gcc_url, gcc_mirror, 1))
          PY

          docker buildx build \
            --platform=linux/amd64 \
            --target base-env \
            --build-arg BASE=base-4.9 \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --load \
            -t "$IMAGE" \
            "$RUNNER_TEMP/qnx-toolchain"

      - name: Build QNX support tools unstripped
        shell: bash
        run: |
          set -euxo pipefail
          docker run --rm --platform=linux/amd64 \
            -v "$PWD:/src" \
            -w /src \
            "$IMAGE" \
            bash -c 'bash ./tools/build_support_tools.sh build/support-tools'

          sudo chown -R "$(id -u):$(id -g)" build/support-tools

      - name: Reproduce vehicle-tested stripped isoTX2 gate
        shell: bash
        run: |
          set -euxo pipefail
          docker run --rm --platform=linux/amd64 \
            -v "$PWD:/src" \
            -w /src \
            "$IMAGE" \
            bash -c '
              set -euxo pipefail
              qcc -shared -fPIC -mfloat-abi=softfp -O2 -std=gnu99 -Wall -Wextra \
                src/native/isotx2-gate/isotx2_gate.c \
                -Wl,-soname,libmibr_isotx2_gate.so \
                -o build/support-tools/libmibr_isotx2_gate_vehicle.so
              arm-unknown-nto-qnx6.5.0eabi-strip -s \
                build/support-tools/libmibr_isotx2_gate_vehicle.so
            '
          sudo chown "$(id -u):$(id -g)" build/support-tools/libmibr_isotx2_gate_vehicle.so
          ACTUAL="$(sha256sum build/support-tools/libmibr_isotx2_gate_vehicle.so | awk '{print $1}')"
          echo "vehicle_gate_sha256=$ACTUAL"
          test "$ACTUAL" = "05673010a88c25022145ffb4e75d3715eaf686f4127ac188e91a52f512b9d957"

      - name: Validate ELF, symbols and strict MOST contract
        shell: bash
        run: |
          set -euxo pipefail

          for f in libmibr_isotx2_gate.so gate_selftest_qnx most-ts-writer sha256sum tee shmem-fs-probe bound-process-probe; do
            file "build/support-tools/$f"

            docker run --rm --platform=linux/amd64 \
              -v "$PWD:/src" -w /src "$IMAGE" \
              arm-unknown-nto-qnx6.5.0eabi-readelf -h "build/support-tools/$f" \
              > "build/support-tools/$f.ELF.txt"

            docker run --rm --platform=linux/amd64 \
              -v "$PWD:/src" -w /src "$IMAGE" \
              arm-unknown-nto-qnx6.5.0eabi-readelf -S "build/support-tools/$f" \
              > "build/support-tools/$f.SECTIONS.txt"

            grep -q 'Machine:.*ARM' "build/support-tools/$f.ELF.txt"
            grep -q '\.symtab' "build/support-tools/$f.SECTIONS.txt"
            grep -q '\.debug_info' "build/support-tools/$f.SECTIONS.txt"
            sha256sum "build/support-tools/$f" > "build/support-tools/$f.sha256"
          done

          for s in open open64 writev close; do
            readelf -Ws build/support-tools/libmibr_isotx2_gate.so |
              grep -E "[[:space:]]$s$"
          done

          strings build/support-tools/libmibr_isotx2_gate.so |
            grep -Fq '/dev/mlb/isoTX2'

          grep -Eq '^#define[[:space:]]+TS_SIZE[[:space:]]+188$' \
            src/native/most-ts-writer/most_ts_writer.c
          grep -Eq '^#define[[:space:]]+STRICT_BLOCK_PACKETS[[:space:]]+64$' \
            src/native/most-ts-writer/most_ts_writer.c
          grep -Fq '#define STRICT_BLOCK_BYTES (STRICT_BLOCK_PACKETS * TS_SIZE)' \
            src/native/most-ts-writer/most_ts_writer.c
          strings build/support-tools/most-ts-writer |
            grep -Fq 'write_size=%u'

      - name: Upload unstripped support tools
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mu1440-support-tools-unstripped
          path: build/support-tools/
          if-no-files-found: error


      - name: Publish build-confirmed gate artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euxo pipefail
          DEST=artifacts/mu1440/isotx2-gate/build-confirmed-current
          mkdir -p "$DEST"
          cp build/support-tools/libmibr_isotx2_gate.so "$DEST/libmibr_isotx2_gate.so"
          sed 's#build/support-tools/##' build/support-tools/libmibr_isotx2_gate.so.sha256 > "$DEST/libmibr_isotx2_gate.so.sha256"
          cat > "$DEST/README.md" <<'EOF'
          # Build-confirmed isoTX2 writev gate

          This binary is produced by the pinned public QNX 6.5 ARMv7 workflow from
          `src/native/isotx2-gate/isotx2_gate.c`.

          The gate mechanism/source has been vehicle-proven on the MU1440 reference target.
          This particular public binary is labelled **build-confirmed** unless its exact SHA-256
          is separately recorded in a vehicle test.

          The library defaults to STOCK/pass-through behavior. DIRECT suppression is only requested
          through the explicit runtime marker/control path.

          See `docs/architecture/DIRECT_VC_VIDEO_PATH.md` and `runtime/isotx2-gate/`.
          EOF
          VEHICLEDEST=artifacts/mu1440/isotx2-gate/vehicle-tested-2026-09-27
          mkdir -p "$VEHICLEDEST"
          cp build/support-tools/libmibr_isotx2_gate_vehicle.so "$VEHICLEDEST/libmibr_isotx2_gate.so"
          sha256sum "$VEHICLEDEST/libmibr_isotx2_gate.so" | sed 's#  .*/#  #' > "$VEHICLEDEST/libmibr_isotx2_gate.so.sha256"
          cat > "$VEHICLEDEST/README.md" <<'EOF'
          # Vehicle-tested MU1440 isoTX2 gate — 2026-09-27

          Exact stripped QNX ARMv7 build identity recovered from the archived vehicle-test package
          and reproduced from the public source/toolchain.

          SHA-256:

          `05673010a88c25022145ffb4e75d3715eaf686f4127ac188e91a52f512b9d957`

          This is the exact gate binary identity used by the vehicle-proven MU1440/AID10 media path.
          EOF

          SHADEST=artifacts/mu1440/sha256sum-compat/build-confirmed-current
          mkdir -p "$SHADEST"
          cp build/support-tools/sha256sum "$SHADEST/sha256sum"
          sed 's#build/support-tools/##' build/support-tools/sha256sum.sha256 > "$SHADEST/sha256sum.sha256"
          cat > "$SHADEST/README.md" <<'EOF'
          # Build-confirmed QNX SHA-256 compatibility helper

          Minimal project-owned SHA-256 file utility used by the guarded MU1440 developer deployment.
          It is built from `src/native/sha256sum-compat/sha256sum_compat.c` with the same pinned public
          QNX 6.5 ARMv7 toolchain as the other support tools.

          The deployment uses this helper so it has no hidden dependency on an existing M.I.B.
          `/apps/sbin` SD-card layout.
          EOF
          TEEDEST=artifacts/mu1440/tee-compat/build-confirmed-current
          mkdir -p "$TEEDEST"
          cp build/support-tools/tee "$TEEDEST/tee"
          sed 's#build/support-tools/##' build/support-tools/tee.sha256 > "$TEEDEST/tee.sha256"
          cat > "$TEEDEST/README.md" <<'EOF'
          # Build-confirmed QNX tee compatibility helper

          Project-owned MU1440/QNX 6.5 ARMv7 logging helper implementing the subset used by the
          deployment and Auto-Direct runtime: stdin -> stdout plus file outputs, with `-a` append
          and `-i` ignore-SIGINT compatibility.

          It replaces the historical dependency on M.I.B. `apps/sbin/tee` without redistributing
          a QNX/OEM binary.
          EOF

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$DEST" "$VEHICLEDEST" "$SHADEST" "$TEEDEST"
          if git diff --cached --quiet; then
            echo "Gate artifact unchanged."
            exit 0
          fi
          git commit -m "artifacts: publish build-confirmed isoTX2 gate"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
