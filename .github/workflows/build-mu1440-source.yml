name: Build MU1440 source stack

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/build-mu1440-source.yml'
      - '.github/workflows/build-altscreen111-gen2.yml'
      - 'settings/**'
      - 'modules/broker/source/**'
      - 'modules/navigation/source/**'
      - 'modules/carplay/source/**'
      - 'modules/menu/source/**'
      - 'tools/menu-editor/**'
      - 'tests/**'
      - 'tools/build_*.sh'
      - 'tools/ci_qnx65_image.sh'
      - 'tools/qnx65-image.lock'
      - 'tools/check_mu1440_target_shell.py'
      - 'tools/generate_alt111_settings.py'
      - 'tools/test_*.sh'
      - 'tools/source-overlays/**'
      - 'modules/carplay/runtime/**'
      - 'modules/broker/runtime/**'
      - 'deployment/mu1440-parity-drive-v1/**'
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-mu1440-source.yml'
      - '.github/workflows/build-altscreen111-gen2.yml'
      - 'settings/**'
      - 'modules/broker/source/**'
      - 'modules/navigation/source/**'
      - 'modules/carplay/source/**'
      - 'modules/menu/source/**'
      - 'tools/menu-editor/**'
      - 'tests/**'
      - 'tools/build_*.sh'
      - 'tools/ci_qnx65_image.sh'
      - 'tools/qnx65-image.lock'
      - 'tools/check_mu1440_target_shell.py'
      - 'tools/generate_alt111_settings.py'
      - 'tools/test_*.sh'
      - 'tools/source-overlays/**'
      - 'modules/carplay/runtime/**'
      - 'modules/broker/runtime/**'
      - 'deployment/mu1440-parity-drive-v1/**'

permissions:
  contents: read
  packages: read

concurrency:
  group: public-mu1440-source-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TOOLCHAIN_REPO: https://github.com/luka-dev/qnx65-armv7-toolchain.git
  TOOLCHAIN_COMMIT: 56a66557245af14077678cd28a83ce3a337d9e2d
  TOOLCHAIN_DOCKERFILE_SHA256: 9a867a7ae70f2c0222a241b80232856526ccec0db2cfe013f8991ca31c74bcb1
  IMAGE: mhi2-qnx65-armv7-public:4.9

jobs:
  host:
    name: Host tests and source checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install host test dependencies
        shell: bash
        run: |
          set -euxo pipefail
          # ubuntu-24.04 already supplies a JDK; verify it instead of downloading another.
          command -v java
          command -v javac
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get -o Acquire::Retries=3 update
            sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends ffmpeg
          fi
          gcc --version
          python3 --version
          javac -version
          ffmpeg -version | head -n 2

      - name: Validate canonical registry and installed GEN2 host fixtures
        shell: bash
        run: |
          set -euxo pipefail
          python3 tools/generate_alt111_settings.py --check
          bash tools/test_installed_gen2_host.sh
          bash tools/test_gen2_components_host.sh

      - name: Run direct parity and native gate host regressions
        shell: bash
        run: |
          set -euxo pipefail
          bash tools/test_parity_host.sh

      - name: Gate QNX shell compatibility for current runtime scripts
        shell: bash
        run: |
          set -euxo pipefail
          python3 -B tools/check_mu1440_target_shell.py --self-test --check \
            modules/carplay/runtime/parity/master-script-basenames.sh \
            modules/carplay/runtime/parity/parity_drive_disable.sh \
            modules/carplay/runtime/parity/parity_drive_enable.sh \
            modules/carplay/runtime/parity/parity_drive_status.sh \
            modules/carplay/runtime/parity/parity_drive_supervisor.sh \
            modules/carplay/runtime/parity/parity_profile.sh \
            modules/carplay/runtime/parity/parity_session.sh \
            modules/carplay/runtime/parity/parity_status.sh \
            modules/broker/runtime/mibr-control/mibr-engine.ksh \
            modules/broker/runtime/mibr-control/mibr-menu.ksh \
            modules/broker/runtime/mibr-control/mibr-view.ksh \
            modules/broker/runtime/mibr-control/mibr-watch.ksh \
            modules/broker/runtime/mibr-control/mibr-v3-boot.ksh \
            modules/broker/runtime/mibr-control/parity_drive_supervisor_r53.sh \
            deployment/mu1440-parity-drive-v1/session-logging.sh

      - name: Build and test MIBR/3 host controller
        shell: bash
        run: |
          set -euxo pipefail
          export PATH=/usr/bin:/bin:$PATH
          export CC=/usr/bin/gcc
          export PYTHONDONTWRITEBYTECODE=1
          export PYTHONPATH="$PWD/tests/mibr-control${PYTHONPATH:+:$PYTHONPATH}"
          export MIBR_CONTROL_OUT="$PWD/build/host/mibr-control"
          bash tools/build_mibr_control.sh host
          gcc -O2 -g -std=gnu99 -Wall -Wextra -Werror \
            -DALT111_SETTINGS_TEST -DMIBR_SHA256_LIBRARY_ONLY \
            -Imodules/carplay/source/altscreen111-gen2/include -Imodules/carplay/source/alt111-settings/include \
            modules/carplay/source/alt111-settings/settings_cli.c \
            modules/carplay/source/alt111-settings/settings_core.c \
            modules/carplay/source/alt111-settings/settings_posix.c \
            modules/carplay/source/altscreen111-gen2/src/alt111_policy.c \
            modules/carplay/source/sha256sum-compat/sha256sum_compat.c \
            -o "$PWD/build/host/alt111-settings"
          export MIBR_PINNED_ALT111_CLI="$PWD/build/host/alt111-settings"
          export MIBR_V3_NATIVE_SERVICE_BIN="$MIBR_CONTROL_OUT/mibr-v3-service-host"
          export MIBR_V3_NATIVE_CLIENT_BIN="$MIBR_CONTROL_OUT/mibrctl-v3-host"
          MIBR_V3_NATIVE_HOST_BIN="$MIBR_CONTROL_OUT/mibr-v3-service-host" \
          MIBR_V3_NATIVE_READONLY_HOST_BIN="$MIBR_CONTROL_OUT/mibr-v3-host-harness" \
            python3 -B -m unittest discover -s tests/mibr-control -p 'test_*.py' -v

      - name: Test GEN2 suggestUI root advertisement
        run: python3 -B -m unittest discover -s modules/carplay/source/altscreen111-gen2/tests -p 'test_suggestui_root_*.py' -v

      - name: Validate OEM menu catalog and source adapters
        shell: bash
        run: |
          set -euxo pipefail
          # Portable source contracts. Optional OEM-reference/capture suites
          # remain available locally when their external fixtures are supplied.
          python3 -B -m unittest -v \
            modules.menu.source.tests.test_generate_catalog \
            modules.menu.source.tests.test_menu_generator \
            modules.menu.source.tests.test_i18n \
            modules.menu.source.tests.test_prepare_oem_sources \
            modules.menu.source.tests.test_verify_class_major \
            modules.menu.source.tests.test_v3_route \
            modules.menu.source.tests.test_native_rows_callbacks
          python3 -B -m unittest discover -s modules/menu/source/tests -p 'test_*.py' -v
          bash modules/menu/source/tests/run_view_model_test.sh
          python3 -B modules/menu/source/generate_catalog.py \
            --registry settings/registry.json \
            --menu modules/menu/source/menu-definition.json \
            --out-dir build/oem-menu-generated
          python3 -B modules/menu/source/generate_catalog.py --check \
            --registry settings/registry.json \
            --menu modules/menu/source/menu-definition.json \
            --out-dir build/oem-menu-generated

  qnx:
    name: QNX 6.5 ARMv7 source build
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Select verified QNX 6.5 ARMv7 image
        shell: bash
        env:
          QNX65_GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          bash tools/ci_qnx65_image.sh
      - name: Build all MU1440 source outputs in one QNX container
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build/mu1440-source
          docker run --rm --platform=linux/amd64 \
            -v "$PWD:/src" -w /src "$IMAGE" \
            bash -c 'QNX_CC=arm-unknown-nto-qnx6.5.0eabi-gcc bash tools/build_mu1440_source.sh build/mu1440-source'
          sudo chown -R "$(id -u):$(id -g)" build/mu1440-source
          cp "$QNX_TOOLCHAIN_PROVENANCE" build/mu1440-source/QNX_TOOLCHAIN_PROVENANCE.txt

      - name: Verify expected installed source identities
        shell: bash
        run: |
          set -euxo pipefail
          OUT=build/mu1440-source
          FROZEN_SOURCE_BASELINE=960d808f4e80622808c4b57b777723fbddb81839
          git cat-file -e "$FROZEN_SOURCE_BASELINE^{commit}"
          expected=(
            libaltscreen111.so alt111-settings direct-ts-parity libmibr_isotx2_guard.so
            libmibr_isotx2_gate.so parity-session
            mibr-control/mibr-v3-service-QNX65-ARMv7-NOT-INSTALL-READY
            mibr-control/mibrctl-v3-QNX65-ARMv7-NOT-INSTALL-READY
            mibr-control/mibr-v3-genkey-QNX65-ARMv7-NOT-INSTALL-READY
            mibr-control/mibr-key40d-QNX65-ARMv7-NOT-INSTALL-READY
          )
          if git diff --quiet "$FROZEN_SOURCE_BASELINE" HEAD -- settings modules/carplay/source tools/build_*.sh tools/generate_alt111_settings.py; then
            echo "Frozen installed-output verification: source inputs match $FROZEN_SOURCE_BASELINE"
            expect_sha() {
              local file=$1 expected=$2 actual
              actual=$(sha256sum "$file" | awk '{print $1}')
              if [[ "$actual" != "$expected" ]]; then
                echo "SHA-256 mismatch for $file: expected $expected, got $actual" >&2
                exit 1
              fi
              echo "$file SHA256=$actual"
            }
            expect_sha "$OUT/libaltscreen111.so" 304b5079374a08ed9a763528217476b29ad49e000ba25d0372ed4147cbb9a705
            expect_sha "$OUT/alt111-settings" b0d61578452a93b966f268e2bd400029bb1b6fa249dfd18e8895f851ca89073c
            expect_sha "$OUT/direct-ts-parity" 3098cdd4469a4a3b4ee92c583518b3af362e02e41921ed3d80641853ced0827b
            expect_sha "$OUT/libmibr_isotx2_guard.so" cad06d69c698c8940dec9596b96c6b90ec822bdd437c4b0d02a35881ad71fae4
            expect_sha "$OUT/libmibr_isotx2_gate.so" 05673010a88c25022145ffb4e75d3715eaf686f4127ac188e91a52f512b9d957
            expect_sha "$OUT/mibr-control/mibr-v3-service-QNX65-ARMv7-NOT-INSTALL-READY" 97177ddbfe78d49dc0d672c5b70e717a87c0aeebb6ac65ab4e1b7df12e60bb58
            expect_sha "$OUT/mibr-control/mibrctl-v3-QNX65-ARMv7-NOT-INSTALL-READY" fa4a580337a6a0a1d67e15ee1abc7f809591978cbfdecada5b87259fb8a5f351
            expect_sha "$OUT/mibr-control/mibr-v3-genkey-QNX65-ARMv7-NOT-INSTALL-READY" 328837d6df6daaeec25197d8cb9f7e9070c194e012f86dfc3c75256cb36d5474
            expect_sha "$OUT/mibr-control/mibr-key40d-QNX65-ARMv7-NOT-INSTALL-READY" 3612c686a6de43c7cfbcb4e96645bca83ba9db33f8c03b19e33c0c73efbaf9d2
            echo 'Canonical owner includes an additional stopped-until-dead safety correction; original R52 a7382451 was reproduced separately.'
          else
            echo "Development source inputs differ from frozen baseline $FROZEN_SOURCE_BASELINE; validating artifact inventory and ARM ELF identity."
            for artifact in "${expected[@]}"; do
              test -s "$OUT/$artifact"
              readelf -h "$OUT/$artifact" | grep -q 'Machine:.*ARM'
              echo "QNX_ARM_ELF=PASS $artifact"
            done
          fi
          test -s "$OUT/mibr-control/SERVICE_ELF_HEADER.txt"
          (cd "$OUT" && sha256sum -c SHA256SUMS)
          echo 'Current artifact SHA-256 values (build identity only; no released/install identity claim):'
          (cd "$OUT" && sha256sum "${expected[@]}")

      - name: Bind actual QNX outputs to canonical module sources
        shell: bash
        run: |
          set -euxo pipefail
          python3 tools/emit_module_build_lineage.py \
            --commit "$(git rev-parse HEAD)" \
            --target-profile skoda-mu1440-p4526 \
            --toolchain-commit "$TOOLCHAIN_COMMIT" \
            --toolchain-dockerfile-sha256 "$TOOLCHAIN_DOCKERFILE_SHA256" \
            --artifact carplay:libaltscreen111.so=build/mu1440-source/libaltscreen111.so \
            --artifact carplay:alt111-settings=build/mu1440-source/alt111-settings \
            --artifact carplay:direct-ts-parity=build/mu1440-source/direct-ts-parity \
            --artifact carplay:libmibr_isotx2_guard.so=build/mu1440-source/libmibr_isotx2_guard.so \
            --artifact carplay:libmibr_isotx2_gate.so=build/mu1440-source/libmibr_isotx2_gate.so \
            --artifact carplay:parity-session=build/mu1440-source/parity-session \
            --artifact broker:mibr-v3-service=build/mu1440-source/mibr-control/mibr-v3-service-QNX65-ARMv7-NOT-INSTALL-READY \
            --artifact broker:mibrctl-v3=build/mu1440-source/mibr-control/mibrctl-v3-QNX65-ARMv7-NOT-INSTALL-READY \
            --artifact broker:mibr-v3-genkey=build/mu1440-source/mibr-control/mibr-v3-genkey-QNX65-ARMv7-NOT-INSTALL-READY \
            --artifact broker:mibr-key40d=build/mu1440-source/mibr-control/mibr-key40d-QNX65-ARMv7-NOT-INSTALL-READY \
            --out build/mu1440-source/MODULE_BUILD_LINEAGE.json
          python3 tools/emit_module_build_lineage.py \
            --verify build/mu1440-source/MODULE_BUILD_LINEAGE.json
          test -s build/mu1440-source/MODULE_BUILD_LINEAGE.json
          # This receipt identifies source inputs and hashes, not vehicle readiness.

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mu1440-source-qnx-build
          retention-days: 30
          path: build/mu1440-source/**
