name: Assemble three-profile beta from reviewed Research prebuilts

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: multiprofile-beta-release
  cancel-in-progress: false

jobs:
  source-locks:
    name: Review public source fingerprints (no private credentials)
    if: github.repository == 'harman-f/mhi2_altscreen_carplay' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Refuse stale Java and native binary inputs
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/release/stage_prebuilt_menu.py --check-only
          python3 -B tools/release/stage_research_prebuilts.py --check-sources

  assemble:
    name: Assemble verified ZIP (private Research read access)
    needs: source-locks
    if: github.repository == 'harman-f/mhi2_altscreen_carplay' && github.ref == 'refs/heads/main' && vars.MIBR_RESEARCH_PREBUILT_RELEASE_ENABLED == 'true'
    runs-on: ubuntu-24.04
    environment: multiprofile-private-build
    timeout-minutes: 30
    steps:
      - name: Checkout exact main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download immutable private Research reference
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.MIBR_RESEARCH_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || { echo 'MIBR_RESEARCH_READ_TOKEN missing'; exit 1; }
          # A narrow fine-grained, read-only token for CaneTLOTW/M.I.B._Research.
          # Never download on PRs or untrusted branches. The SHA-256 is checked
          # by stage_research_prebuilts.py before any byte is staged.
          gh api -H 'Accept: application/vnd.github.raw+json' \
            '/repos/CaneTLOTW/M.I.B._Research/contents/MIBR-CarPlay-beta-3profile-r11b.zip?ref=f733de43f58c71e4c7743dbda438b906959bce66' \
            > "$RUNNER_TEMP/research-r11b.zip"
          test -s "$RUNNER_TEMP/research-r11b.zip"
          sha256sum "$RUNNER_TEMP/research-r11b.zip"

      - name: Validate original private reference package
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/validate_modular_package.py --require-complete "$RUNNER_TEMP/research-r11b.zip"

      - name: Stage exact binary inputs and currently reviewed menu JARs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mibr-hmi"
          python3 -B tools/release/stage_prebuilt_menu.py --out "$RUNNER_TEMP/mibr-hmi"
          python3 -B tools/release/stage_research_prebuilts.py \
            --archive "$RUNNER_TEMP/research-r11b.zip" \
            --out-native "$RUNNER_TEMP/mibr-native" \
            --out-hmi "$RUNNER_TEMP/mibr-hmi"
          python3 -I modules/menu/source/extender-p1/toolchain/verify_p1_jar.py \
            "$RUNNER_TEMP/mibr-hmi/common/MIBR-Extender-P1-BootProbe.jar"

      - name: Assemble current-source package and verify it
        shell: bash
        env:
          OUT: ${{ runner.temp }}/mibr-three-profile-beta
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          python3 -B tools/release/build_modular.py \
            --native-dir "$RUNNER_TEMP/mibr-native" \
            --hmi-dir "$RUNNER_TEMP/mibr-hmi" \
            --out "$OUT/MIBR-CarPlay-three-profile-beta.zip" \
            --use-research-prebuilts --require-complete
          python3 -B tools/validate_modular_package.py --require-complete \
            "$OUT/MIBR-CarPlay-three-profile-beta.zip"
          python3 -B tools/release/build_modular.py --check \
            "$OUT/MIBR-CarPlay-three-profile-beta.zip"
          (cd "$OUT" && sha256sum MIBR-CarPlay-three-profile-beta.zip \
            > MIBR-CarPlay-three-profile-beta.zip.sha256)
          (cd "$OUT" && sha256sum --check --strict MIBR-CarPlay-three-profile-beta.zip.sha256)
          echo "MULTIPROFILE_BETA_PACKAGE=PASS source_commit=$GITHUB_SHA"

      - name: Upload validated beta ZIP (not a GitHub Release)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MIBR-CarPlay-three-profile-beta-${{ github.sha }}
          path: |
            ${{ runner.temp }}/mibr-three-profile-beta/MIBR-CarPlay-three-profile-beta.zip
            ${{ runner.temp }}/mibr-three-profile-beta/MIBR-CarPlay-three-profile-beta.zip.sha256
          if-no-files-found: error
          retention-days: 30
