name: Build MU1440 Omonob790 functional-parity bridge

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/build-direct-ts-parity.yml'
      - 'src/native/direct-ts-parity/**'
      - 'tools/build_direct_ts_parity.sh'
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-direct-ts-parity.yml'
      - 'src/native/direct-ts-parity/**'
      - 'tools/build_direct_ts_parity.sh'

permissions:
  contents: read

concurrency:
  group: mu1440-omonob790-parity
  cancel-in-progress: true

env:
  TOOLCHAIN_REPO: https://github.com/luka-dev/qnx65-armv7-toolchain.git
  TOOLCHAIN_COMMIT: 56a66557245af14077678cd28a83ce3a337d9e2d
  TOOLCHAIN_DOCKERFILE_SHA256: 9a867a7ae70f2c0222a241b80232856526ccec0db2cfe013f8991ca31c74bcb1
  IMAGE: mhi2-qnx65-armv7-public:4.9
  OUTDIR: build/ci-direct-ts-parity
  TARGET_FIRMWARE: MHI2_ER_SKG13_P4526_MU1440

jobs:
  build:
    name: Build and audit parity bridge
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Host semantic self-test
        shell: bash
        run: |
          set -euxo pipefail
          cc -O2 -g -std=gnu99 -Wall -Wextra -Werror \
            src/native/direct-ts-parity/direct_ts_parity.c -pthread \
            -o /tmp/direct-ts-parity-host
          /tmp/direct-ts-parity-host --self-test | tee /tmp/parity-selftest.txt
          grep -Fxq 'PARITY_SELFTEST=PASS' /tmp/parity-selftest.txt
          python3 tests/direct_ts_parity_host_integration.py /tmp/direct-ts-parity-host \
            | tee /tmp/parity-integration.txt
          grep -Fq 'PARITY_INTEGRATION=PASS' /tmp/parity-integration.txt

      - name: Build pinned QNX 6.5 ARMv7 toolchain image
        shell: bash
        run: |
          set -euxo pipefail
          git clone "$TOOLCHAIN_REPO" "$RUNNER_TEMP/qnx-toolchain"
          git -C "$RUNNER_TEMP/qnx-toolchain" checkout "$TOOLCHAIN_COMMIT"
          test "$(sha256sum "$RUNNER_TEMP/qnx-toolchain/Dockerfile" | awk '{print $1}')" = "$TOOLCHAIN_DOCKERFILE_SHA256"
          python3 - "$RUNNER_TEMP/qnx-toolchain/Dockerfile" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1])
          s=p.read_text()
          needle="RUN dpkg --add-architecture i386 && apt-get update && \\\n"
          replacement=(
              "RUN sed -i 's#http://deb.debian.org/debian-security#"
              "http://snapshot.debian.org/archive/debian-security/20260903T220410Z#g' "
              "/etc/apt/sources.list && \\\n"
              "    echo 'Acquire::Check-Valid-Until \"false\";' "
              "> /etc/apt/apt.conf.d/99snapshot && \\\n"
              "    dpkg --add-architecture i386 && apt-get update && \\\n"
          )
          if needle not in s:
              raise SystemExit("qnx-sdp apt bootstrap anchor not found")
          p.write_text(s.replace(needle,replacement,1))
          PY
          docker buildx build --platform=linux/amd64 \
            --target base-env --build-arg BASE=base-4.9 \
            --cache-from type=gha --cache-to type=gha,mode=max \
            --load -t "$IMAGE" "$RUNNER_TEMP/qnx-toolchain"

      - name: Build QNX parity bridge
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$OUTDIR"
          docker run --rm --platform=linux/amd64 \
            -v "$PWD:/src" -w /src "$IMAGE" \
            bash -c 'bash ./tools/build_direct_ts_parity.sh src/native/direct-ts-parity/direct_ts_parity.c build/ci-direct-ts-parity/direct-ts-parity'
          sudo chown -R "$(id -u):$(id -g)" "$OUTDIR"

      - name: Binary and contract audit
        shell: bash
        run: |
          set -euxo pipefail
          BIN="$OUTDIR/direct-ts-parity"
          docker run --rm --platform=linux/amd64 -v "$PWD:/src" -w /src "$IMAGE" \
            arm-unknown-nto-qnx6.5.0eabi-readelf -h "$BIN" > "$OUTDIR/ELF_HEADER.txt"
          docker run --rm --platform=linux/amd64 -v "$PWD:/src" -w /src "$IMAGE" \
            arm-unknown-nto-qnx6.5.0eabi-readelf -d "$BIN" > "$OUTDIR/DYNAMIC.txt"
          docker run --rm --platform=linux/amd64 -v "$PWD:/src" -w /src "$IMAGE" \
            arm-unknown-nto-qnx6.5.0eabi-readelf -Ws "$BIN" > "$OUTDIR/SYMBOLS.txt"
          file "$BIN" | tee "$OUTDIR/FILE.txt"
          grep -q 'Machine:.*ARM' "$OUTDIR/ELF_HEADER.txt"
          strings "$BIN" | grep -Fq 'architecture=omonob790-functional-parity-cleanroom'
          strings "$BIN" | grep -Fq 'source_clock=stream111-32.32'
          strings "$BIN" | grep -Fq 'pts_clock=source-derived-90khz'
          strings "$BIN" | grep -Fq 'frame_pacer=none'
          strings "$BIN" | grep -Fq 'PARITY_START'
          strings "$BIN" | grep -Fq 'PARITY_PTS_REBASE'
          strings "$BIN" | grep -Fq '/tmp/mibr-alt111-keyframe-only'
          ! strings "$BIN" | grep -Fq 'avformat_'
          ! strings "$BIN" | grep -Fq 'libavformat'
          sha256sum "$BIN" | tee "$OUTDIR/direct-ts-parity.sha256"
          cat > "$OUTDIR/BUILDINFO.txt" <<INFO
          artifact=direct-ts-parity
          architecture=omonob790-functional-parity-cleanroom
          target=$TARGET_FIRMWARE
          qnx=6.5-armv7-softfp
          source_commit=${{ github.event.pull_request.head.sha || github.sha }}
          source_path=src/native/direct-ts-parity/direct_ts_parity.c
          frame_pacer=none
          input=m1au-complete-au
          source_clock=stream111-32.32
          pts_clock=source-derived-90khz
          transport_bps=12288000
          pat_pid=0x0000
          pmt_pid=0x0010
          pcr_pid=0x1000
          video_pid=0x0011
          most_write_bytes=12032
          toolchain_commit=$TOOLCHAIN_COMMIT
          INFO
          sed -i 's/^          //' "$OUTDIR/BUILDINFO.txt"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: direct-ts-parity-MU1440-unstripped
          path: |
            ${{ env.OUTDIR }}/direct-ts-parity
            ${{ env.OUTDIR }}/direct-ts-parity.sha256
            ${{ env.OUTDIR }}/BUILDINFO.txt
            ${{ env.OUTDIR }}/FILE.txt
            ${{ env.OUTDIR }}/ELF_HEADER.txt
            ${{ env.OUTDIR }}/DYNAMIC.txt
            ${{ env.OUTDIR }}/SYMBOLS.txt
