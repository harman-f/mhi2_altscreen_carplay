name: Build MU1440 parity-drive bridge

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/build-direct-ts-parity.yml'
      - 'src/native/direct-ts-parity/**'
      - 'src/native/parity-session/**'
      - 'runtime/parity/**'
      - 'runtime/master/**'
      - 'runtime/diagnostics/gen2_compat_profile.sh'
      - 'tools/build_direct_ts_parity.sh'
      - 'tools/build_parity_session.sh'
      - 'tools/build_native_isotx2_guard.sh'
      - 'tests/direct_ts_parity*'
      - 'tests/parity_session*'
      - 'tests/parity_overlay_rollback.py'
      - 'src/native/altscreen111-gen2/**'
      - 'src/native/alt111-settings/**'
      - 'settings/**'
      - 'tools/generate_alt111_settings.py'
      - 'tools/build_alt111_settings.sh'
      - 'tests/alt111_*'
      - 'deployment/mu1440-parity-drive-v1/**'
      - 'deployment/mu1440-fixture-replay-v1/**'
      - 'tests/test_mu1440_fixture_replay.py'
      - 'tests/test_mu1440_clockdiag.py'
      - 'tools/prepare_mu1440_parity_drive_v1_overlay.sh'
  push:
    branches: [ main, codex/mu1440-parity-drive-v1 ]
    paths:
      - '.github/workflows/build-direct-ts-parity.yml'
      - 'src/native/direct-ts-parity/**'
      - 'src/native/parity-session/**'
      - 'runtime/parity/**'
      - 'runtime/master/**'
      - 'runtime/diagnostics/gen2_compat_profile.sh'
      - 'tools/build_direct_ts_parity.sh'
      - 'tools/build_parity_session.sh'
      - 'tools/build_native_isotx2_guard.sh'
      - 'tests/direct_ts_parity*'
      - 'tests/parity_session*'
      - 'tests/parity_overlay_rollback.py'
      - 'src/native/altscreen111-gen2/**'
      - 'src/native/alt111-settings/**'
      - 'settings/**'
      - 'tools/generate_alt111_settings.py'
      - 'tools/build_alt111_settings.sh'
      - 'tests/alt111_*'
      - 'deployment/mu1440-parity-drive-v1/**'
      - 'deployment/mu1440-fixture-replay-v1/**'
      - 'tests/test_mu1440_fixture_replay.py'
      - 'tests/test_mu1440_clockdiag.py'
      - 'tools/prepare_mu1440_parity_drive_v1_overlay.sh'

permissions:
  contents: read

concurrency:
  group: mu1440-parity-${{ github.ref }}
  cancel-in-progress: true

env:
  TOOLCHAIN_REPO: https://github.com/luka-dev/qnx65-armv7-toolchain.git
  TOOLCHAIN_COMMIT: 56a66557245af14077678cd28a83ce3a337d9e2d
  TOOLCHAIN_DOCKERFILE_SHA256: 9a867a7ae70f2c0222a241b80232856526ccec0db2cfe013f8991ca31c74bcb1
  IMAGE: mhi2-qnx65-armv7-public:4.9
  OUTDIR: build/ci-direct-ts-parity
  TARGET_FIRMWARE: MHI2_ER_SKG13_P4526_MU1440

jobs:
  build:
    name: Build and audit parity bridge
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Host semantic self-test
        shell: bash
        run: |
          set -euxo pipefail
          python3 tools/generate_alt111_settings.py --check
          cc -O2 -g -std=gnu99 -Wall -Wextra -Werror \
            -Isrc/native/altscreen111-gen2/include \
            tests/alt111_policy_test.c src/native/altscreen111-gen2/src/alt111_policy.c \
            src/native/altscreen111-gen2/src/alt111_control.c -o /tmp/alt111-policy-test
          /tmp/alt111-policy-test
          cc -O2 -g -std=gnu99 -Wall -Wextra -Werror \
            -Isrc/native/altscreen111-gen2/include -Isrc/native/alt111-settings/include \
            tests/alt111_settings_core_test.c src/native/alt111-settings/settings_core.c \
            src/native/altscreen111-gen2/src/alt111_policy.c -o /tmp/alt111-settings-core-test
          /tmp/alt111-settings-core-test
          python3 tests/alt111_settings_integration.py
          python3 tests/alt111_runtime_wrappers.py
          python3 tests/alt111_native_gate_integration.py
          cc -O2 -g -std=gnu99 -Wall -Wextra -Wno-unused-function \
            -DMIBR_SHA256_LIBRARY_ONLY \
            -Isrc/native/altscreen111-gen2/include -Isrc/native/alt111-settings/include \
            tests/alt111_gen2_settings_session_test.c \
            src/native/altscreen111-gen2/src/alt111_{profile,control,policy,video,resync}.c \
            src/native/alt111-settings/settings_{core,posix}.c \
            src/native/sha256sum-compat/sha256sum_compat.c -ldl -pthread \
            -o /tmp/alt111-gen2-settings-session-test
          /tmp/alt111-gen2-settings-session-test
          cc -O2 -g -std=gnu99 -Wall -Wextra -Werror \
            src/native/direct-ts-parity/direct_ts_parity.c -pthread \
            -o /tmp/direct-ts-parity-host
          /tmp/direct-ts-parity-host --self-test | tee /tmp/parity-selftest.txt
          grep -Fxq 'PARITY_SELFTEST=PASS' /tmp/parity-selftest.txt
          cc -O2 -g -std=gnu99 -Wall -Wextra -Werror \
            tests/direct_ts_parity_clock_review.c -pthread -o /tmp/parity-clock-review
          /tmp/parity-clock-review
          python3 tests/direct_ts_parity_host_integration.py /tmp/direct-ts-parity-host \
            | tee /tmp/parity-integration.txt
          grep -Fq 'PARITY_INTEGRATION=PASS' /tmp/parity-integration.txt
          python3 tests/direct_ts_parity_recovery_integration.py /tmp/direct-ts-parity-host \
            | tee /tmp/parity-recovery.txt
          grep -Fq 'PARITY_RECOVERY_INTEGRATION=PASS' /tmp/parity-recovery.txt
          cc -O2 -g -std=gnu99 -Wall -Wextra -Werror tests/direct_ts_parity_regressions.c -pthread -o /tmp/parity-regressions
          /tmp/parity-regressions
          python3 tests/direct_ts_parity_eof_integration.py /tmp/direct-ts-parity-host
          python3 tests/direct_ts_parity_exit_review.py /tmp/direct-ts-parity-host
          python3 tests/test_mu1440_clock_domains.py
          python3 tests/test_mu1440_writer_timing.py
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update; sudo apt-get install -y ffmpeg; fi
          python3 tests/direct_ts_parity_decode_integration.py /tmp/direct-ts-parity-host "$OUTDIR/decode-evidence"
          python3 tests/parity_session_lifecycle.py
          python3 tests/parity_overlay_rollback.py
          python3 tests/parity_session_logging.py
          cc -O2 -g -std=gnu99 -Wall -Wextra -Werror \
            -DMIBR_SHA256_LIBRARY_ONLY \
            -Isrc/native/altscreen111-gen2/include -Isrc/native/alt111-settings/include \
            src/native/parity-session/parity_session.c src/native/alt111-settings/settings_{core,posix}.c \
            src/native/altscreen111-gen2/src/alt111_policy.c \
            src/native/sha256sum-compat/sha256sum_compat.c \
            -o /tmp/parity-session-host
          /tmp/parity-session-host --self-test | tee /tmp/parity-session-selftest.txt
          /tmp/parity-session-host --identity-self-test
          python3 tests/test_mu1440_fixture_replay.py /tmp/direct-ts-parity-host /tmp/parity-session-host
          python3 tests/test_mu1440_clockdiag.py /tmp/direct-ts-parity-host
          bash -n deployment/mu1440-fixture-replay-v1/MU1440_REPLAY_RUN.sh
          grep -Fxq 'PARITY_SESSION_SELFTEST=PASS' /tmp/parity-session-selftest.txt
          grep -Fq 'release=/eso/bin/apps/dmdt dc 72 ; /eso/bin/apps/dmdt sc 4 72' /tmp/parity-session-selftest.txt
          grep -Fq 'restore=/eso/bin/apps/dmdt dc 70 33 ; /eso/bin/apps/dmdt sc 4 70' /tmp/parity-session-selftest.txt
          grep -Fq 'dmdt_timeout_ms=5000' /tmp/parity-session-selftest.txt
          grep -Fq 'watchdog_margin_seconds=20' /tmp/parity-session-selftest.txt
          bash -n runtime/parity/parity_profile.sh
          bash -n runtime/parity/parity_session.sh
          bash -n runtime/parity/parity_status.sh
          bash -n runtime/parity/parity_drive_supervisor.sh
          bash -n runtime/parity/parity_drive_enable.sh
          bash -n runtime/parity/parity_drive_disable.sh
          bash -n runtime/parity/parity_drive_status.sh
          ! grep -Eq '(^|[;&|[:space:]])kill([[:space:]]|$)' runtime/parity/parity_drive_*.sh
          grep -Fq 'mount -uw /net/mmx/fs/sda0' runtime/parity/parity_drive_supervisor.sh
          grep -Fq '/net/mmx/fs/sda0/esd/carplay-test/logs/parity-drive' runtime/parity/parity_drive_supervisor.sh
          grep -Fq 'DEFAULT_SECONDS=0' runtime/parity/parity_drive_supervisor.sh
          grep -Fq 'status-snapshots.log' runtime/parity/parity_drive_supervisor.sh
          grep -Fq 'current.status' runtime/parity/parity_drive_supervisor.sh
          grep -Fq 'current.statistics' runtime/parity/parity_drive_supervisor.sh
          grep -Fq 'gen2_source_fps' runtime/parity/parity_drive_supervisor.sh
          grep -Fq 'parity_input_non_idr_fps' runtime/parity/parity_drive_supervisor.sh
          grep -Fq 'SUP=$BASE/scripts/parity_drive_supervisor.sh' runtime/parity/parity_drive_enable.sh
          grep -Fq '/bin/ksh /mnt/app/root/altscreen-u2/scripts/parity_drive_supervisor.sh' runtime/parity/parity_drive_enable.sh
          grep -Fq '/[p]arity_drive_supervisor.sh/' runtime/parity/parity_drive_supervisor.sh
          grep -Fq '/net/mmx/fs/sda0/esd/carplay-test/logs/parity-drive' runtime/parity/parity_drive_status.sh
          ! grep -E 'classic_single_view_drive_supervisor\.sh|omonob790_drive_supervisor\.sh|classic_single_view-parity-drive|\[o\]parity_drive_supervisor\.sh' runtime/parity/parity_drive_*.sh
          grep -Fq 'mibr-parity-statistics-enabled' runtime/parity/parity_drive_status.sh
          grep -Fq 'EXPECTED_BASE_GEN2_VEHICLE_CURRENT=0406c607ef4e3b32a9b793cc83a7baffd7228437d18fd4671a464c2bf74439ac' deployment/mu1440-parity-drive-v1/install.sh
          grep -Fq '[ "$HH" = "$GH" ] || fail "base_hook_gen2_mismatch gen2=$GH hook=$HH"' deployment/mu1440-parity-drive-v1/install.sh
          grep -Fq 'accepted_vehicle_current_base_gen2_sha256=0406c607ef4e3b32a9b793cc83a7baffd7228437d18fd4671a464c2bf74439ac' tools/prepare_mu1440_parity_drive_v1_overlay.sh
          grep -Fq 'output_non_idr_aus_completed' src/native/direct-ts-parity/direct_ts_parity.c
          grep -Fq 'output_slice_p_completed' src/native/direct-ts-parity/direct_ts_parity.c
          bash -n runtime/diagnostics/gen2_compat_profile.sh
          grep -Fq '"$HELPER" preset --preset classic_single_view' runtime/parity/parity_profile.sh
          grep -Fq 'alt111_policy_au(&g2_policy,g2_video.stream' src/native/altscreen111-gen2/libaltscreen111_gen2.c
          grep -Fq 'O_WRONLY|O_NONBLOCK' src/native/direct-ts-parity/direct_ts_parity.c
          grep -Fq 'DRIVER_DCMD_GET_INTERFACE 0x4004050c' src/native/direct-ts-parity/direct_ts_parity.c
          grep -Fq 'DRIVER_DCMD_GET_PACKET_SIZE 0x4004050d' src/native/direct-ts-parity/direct_ts_parity.c
          grep -Fq 'DRIVER_DCMD_GET_BLOCK_COUNT 0x40040510' src/native/direct-ts-parity/direct_ts_parity.c
          grep -Fq 'LOW_LATENCY_PACKET_LIMIT 1024u' src/native/direct-ts-parity/direct_ts_parity.c
          grep -Fq 'PARITY_SAFE_RECOVERY' src/native/direct-ts-parity/direct_ts_parity.c
          grep -Fq 'queue_recover_au_boundary' src/native/direct-ts-parity/direct_ts_parity.c

      - name: Build pinned QNX 6.5 ARMv7 toolchain image
        shell: bash
        run: |
          set -euxo pipefail
          git clone "$TOOLCHAIN_REPO" "$RUNNER_TEMP/qnx-toolchain"
          git -C "$RUNNER_TEMP/qnx-toolchain" checkout "$TOOLCHAIN_COMMIT"
          test "$(sha256sum "$RUNNER_TEMP/qnx-toolchain/Dockerfile" | awk '{print $1}')" = "$TOOLCHAIN_DOCKERFILE_SHA256"
          python3 - "$RUNNER_TEMP/qnx-toolchain/Dockerfile" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1])
          s=p.read_text()
          needle="RUN dpkg --add-architecture i386 && apt-get update && \\\n"
          replacement=(
              "RUN sed -i 's#http://deb.debian.org/debian-security#"
              "http://snapshot.debian.org/archive/debian-security/20260903T220410Z#g' "
              "/etc/apt/sources.list && \\\n"
              "    echo 'Acquire::Check-Valid-Until \"false\";' "
              "> /etc/apt/apt.conf.d/99snapshot && \\\n"
              "    dpkg --add-architecture i386 && apt-get update && \\\n"
          )
          if needle not in s:
              raise SystemExit("qnx-sdp apt bootstrap anchor not found")
          s=s.replace(needle,replacement,1)
          gcc_url="https://ftp.gnu.org/gnu/gcc/gcc-${GCC49_VER}/gcc-${GCC49_VER}.tar.bz2"
          gcc_mirror="https://mirrors.kernel.org/gnu/gcc/gcc-${GCC49_VER}/gcc-${GCC49_VER}.tar.bz2"
          if gcc_url not in s:
              raise SystemExit("gcc-4.9 download anchor not found")
          p.write_text(s.replace(gcc_url,gcc_mirror,1))
          PY
          docker buildx build --platform=linux/amd64 \
            --target base-env --build-arg BASE=base-4.9 \
            --cache-from type=gha --cache-to type=gha,mode=max \
            --load -t "$IMAGE" "$RUNNER_TEMP/qnx-toolchain"

      - name: Build QNX parity bridge
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$OUTDIR"
          docker run --rm --platform=linux/amd64 \
            -v "$PWD:/src" -w /src "$IMAGE" \
            bash -c 'bash ./tools/build_direct_ts_parity.sh src/native/direct-ts-parity/direct_ts_parity.c build/ci-direct-ts-parity/direct-ts-parity'
          docker run --rm --platform=linux/amd64 \
            -v "$PWD:/src" -w /src "$IMAGE" \
            bash -c 'bash ./tools/build_parity_session.sh src/native/parity-session/parity_session.c build/ci-direct-ts-parity/parity-session'
          docker run --rm --platform=linux/amd64 \
            -v "$PWD:/src" -w /src "$IMAGE" \
            bash -c 'bash ./tools/build_altscreen111_gen2.sh build/ci-direct-ts-parity/libaltscreen111.so'
          docker run --rm --platform=linux/amd64 \
            -v "$PWD:/src" -w /src "$IMAGE" \
            bash -c 'bash ./tools/build_alt111_settings.sh build/ci-direct-ts-parity/alt111-settings'
          docker run --rm --platform=linux/amd64 \
            -v "$PWD:/src" -w /src "$IMAGE" \
            bash -c 'bash ./tools/build_native_isotx2_guard.sh build/ci-direct-ts-parity/libmibr_isotx2_guard.so'
          sudo chown -R "$(id -u):$(id -g)" "$OUTDIR"

      - name: Stage paired low-overhead clock diagnostics toolkit
        shell: bash
        run: |
          set -euxo pipefail
          cp deployment/mu1440-fixture-replay-v1/MU1440_CLOCKDIAG_FIXTURE.sh "$OUTDIR/MU1440_CLOCKDIAG_FIXTURE.sh"
          cp deployment/mu1440-fixture-replay-v1/MU1440_CLOCKDIAG_LIVE.sh "$OUTDIR/MU1440_CLOCKDIAG_LIVE.sh"
          cp deployment/mu1440-fixture-replay-v1/MU1440_CLOCKDIAG_SWAP.sh "$OUTDIR/MU1440_CLOCKDIAG_SWAP.sh"
          cp deployment/mu1440-fixture-replay-v1/CLOCKDIAG_README.md "$OUTDIR/CLOCKDIAG_README.md"
          chmod 755 "$OUTDIR"/MU1440_CLOCKDIAG_*.sh
          bash -n "$OUTDIR"/MU1440_CLOCKDIAG_*.sh
          python3 -m py_compile tools/fixtures/generate_mu1440_motion_m1au.py
          (cd "$OUTDIR"; sha256sum direct-ts-parity parity-session > PAIR_SHA256SUMS.txt; sha256sum -c PAIR_SHA256SUMS.txt)
          BRIDGE_HASH=$(sha256sum "$OUTDIR/direct-ts-parity" | awk '{print $1}')
          OWNER_HASH=$(sha256sum "$OUTDIR/parity-session" | awk '{print $1}')
          sed -i "s/__NEW_BRIDGE_HASH__/$BRIDGE_HASH/g;s/__NEW_OWNER_HASH__/$OWNER_HASH/g" "$OUTDIR/MU1440_CLOCKDIAG_SWAP.sh"
          grep -Fxq "NEW_B=$BRIDGE_HASH" "$OUTDIR/MU1440_CLOCKDIAG_SWAP.sh"
          grep -Fxq "NEW_O=$OWNER_HASH" "$OUTDIR/MU1440_CLOCKDIAG_SWAP.sh"
          ! grep -q '__NEW_.*_HASH__' "$OUTDIR/MU1440_CLOCKDIAG_SWAP.sh"
          bash -n "$OUTDIR"/MU1440_CLOCKDIAG_*.sh
          (cd "$OUTDIR"; sha256sum -c PAIR_SHA256SUMS.txt)
          mkdir -p "$OUTDIR/clockdiag-v1"
          cp "$OUTDIR/direct-ts-parity" "$OUTDIR/parity-session" "$OUTDIR/PAIR_SHA256SUMS.txt" "$OUTDIR"/MU1440_CLOCKDIAG_*.sh "$OUTDIR/CLOCKDIAG_README.md" "$OUTDIR/clockdiag-v1/"
          (cd "$OUTDIR/clockdiag-v1"; sha256sum -c PAIR_SHA256SUMS.txt)
          test "$(find "$OUTDIR/clockdiag-v1" -maxdepth 1 -type f | wc -l)" -eq 7
          # Independent poll prototype directory: never overwrite clockdiag-v1
          # or reuse its original backup. Hashes patched from this CI run.
          mkdir -p "$OUTDIR/pollwait-v1"
          cp "$OUTDIR/direct-ts-parity" "$OUTDIR/parity-session" "$OUTDIR/PAIR_SHA256SUMS.txt" "$OUTDIR/pollwait-v1/"
          cp deployment/mu1440-fixture-replay-v1/MU1440_POLL_*.sh "$OUTDIR/pollwait-v1/"
          cp deployment/mu1440-fixture-replay-v1/POLLWAIT_README.md "$OUTDIR/pollwait-v1/"
          sed -i "s/__NEW_BRIDGE_HASH__/$BRIDGE_HASH/g;s/__NEW_OWNER_HASH__/$OWNER_HASH/g" "$OUTDIR/pollwait-v1/MU1440_POLL_SWAP.sh"
          ! grep -q '__NEW_.*_HASH__' "$OUTDIR/pollwait-v1/MU1440_POLL_SWAP.sh"
          grep -Fxq "NEW_B=$BRIDGE_HASH" "$OUTDIR/pollwait-v1/MU1440_POLL_SWAP.sh"
          grep -Fxq "NEW_O=$OWNER_HASH" "$OUTDIR/pollwait-v1/MU1440_POLL_SWAP.sh"
          grep -Fq 'CI314_B=74c39c205bdab2f5e894cf35e644bf7d9fe9c9b46dc71a27e26bb5c2b237f3e2' "$OUTDIR/pollwait-v1/MU1440_POLL_SWAP.sh"
          grep -Fq 'CI314_O=c513ca1f7fb52df2d6ebb4e65b7bddc7b0aa3c1e455a2d1d614c63972794e370' "$OUTDIR/pollwait-v1/MU1440_POLL_SWAP.sh"
          chmod 755 "$OUTDIR/pollwait-v1"/MU1440_POLL_*.sh
          bash -n "$OUTDIR/pollwait-v1"/MU1440_POLL_*.sh
          (cd "$OUTDIR/pollwait-v1"; sha256sum -c PAIR_SHA256SUMS.txt)
          test "$(find "$OUTDIR/pollwait-v1" -maxdepth 1 -type f | wc -l)" -eq 7
          # Independent follow-up: only the exact vehicle-tested pollwait-v1
          # pair is a permissible installation baseline, with separate backup.
          mkdir -p "$OUTDIR/pollwait-v2"
          cp "$OUTDIR/direct-ts-parity" "$OUTDIR/parity-session" "$OUTDIR/PAIR_SHA256SUMS.txt" "$OUTDIR/pollwait-v2/"
          cp deployment/mu1440-fixture-replay-v1/MU1440_POLL2_*.sh "$OUTDIR/pollwait-v2/"
          cp deployment/mu1440-fixture-replay-v1/POLLWAIT2_README.md "$OUTDIR/pollwait-v2/"
          sed -i "s/__NEW_BRIDGE_HASH__/$BRIDGE_HASH/g;s/__NEW_OWNER_HASH__/$OWNER_HASH/g" "$OUTDIR/pollwait-v2/MU1440_POLL2_SWAP.sh"
          ! grep -q '__NEW_.*_HASH__' "$OUTDIR/pollwait-v2/MU1440_POLL2_SWAP.sh"
          grep -Fxq "NEW_B=$BRIDGE_HASH" "$OUTDIR/pollwait-v2/MU1440_POLL2_SWAP.sh"
          grep -Fxq "NEW_O=$OWNER_HASH" "$OUTDIR/pollwait-v2/MU1440_POLL2_SWAP.sh"
          grep -Fxq 'POLL1_B=10350fb7dc715ec9b99c6b2acadb2a1b3e2ac7342c9281ca57e889fd7d3a4e31' "$OUTDIR/pollwait-v2/MU1440_POLL2_SWAP.sh"
          grep -Fxq 'POLL1_O=232cc5f76feb105230712afd902d0c053339a94051ed8c6910a4e79c388b90ec' "$OUTDIR/pollwait-v2/MU1440_POLL2_SWAP.sh"
          chmod 755 "$OUTDIR/pollwait-v2"/MU1440_POLL2_*.sh
          bash -n "$OUTDIR/pollwait-v2"/MU1440_POLL2_*.sh
          (cd "$OUTDIR/pollwait-v2"; sha256sum -c PAIR_SHA256SUMS.txt)
          test "$(find "$OUTDIR/pollwait-v2" -maxdepth 1 -type f | wc -l)" -eq 7

      - name: Binary and contract audit
        shell: bash
        run: |
          set -euxo pipefail
          BIN="$OUTDIR/direct-ts-parity"
          strings "$BIN" > "$OUTDIR/STRINGS.txt"
          SESSION="$OUTDIR/parity-session"
          strings "$SESSION" > "$OUTDIR/SESSION_STRINGS.txt"
          docker run --rm --platform=linux/amd64 -v "$PWD:/src" -w /src "$IMAGE" \
            arm-unknown-nto-qnx6.5.0eabi-readelf -h "$BIN" > "$OUTDIR/ELF_HEADER.txt"
          docker run --rm --platform=linux/amd64 -v "$PWD:/src" -w /src "$IMAGE" \
            arm-unknown-nto-qnx6.5.0eabi-readelf -d "$BIN" > "$OUTDIR/DYNAMIC.txt"
          docker run --rm --platform=linux/amd64 -v "$PWD:/src" -w /src "$IMAGE" \
            arm-unknown-nto-qnx6.5.0eabi-readelf -Ws "$BIN" > "$OUTDIR/SYMBOLS.txt"
          docker run --rm --platform=linux/amd64 -v "$PWD:/src" -w /src "$IMAGE" \
            arm-unknown-nto-qnx6.5.0eabi-readelf -h "$SESSION" > "$OUTDIR/SESSION_ELF_HEADER.txt"
          file "$BIN" | tee "$OUTDIR/FILE.txt"
          file "$SESSION" | tee "$OUTDIR/SESSION_FILE.txt"
          grep -q 'Machine:.*ARM' "$OUTDIR/ELF_HEADER.txt"
          grep -q 'Machine:.*ARM' "$OUTDIR/SESSION_ELF_HEADER.txt"
          docker run --rm --platform=linux/amd64 -v "$PWD:/src" -w /src "$IMAGE" \
            arm-unknown-nto-qnx6.5.0eabi-readelf -h "$OUTDIR/alt111-settings" > "$OUTDIR/SETTINGS_ELF_HEADER.txt"
          grep -q 'Machine:.*ARM' "$OUTDIR/SETTINGS_ELF_HEADER.txt"
          docker run --rm --platform=linux/amd64 -v "$PWD:/src" -w /src "$IMAGE" \
            arm-unknown-nto-qnx6.5.0eabi-readelf -h "$OUTDIR/libmibr_isotx2_guard.so" > "$OUTDIR/GUARD_ELF_HEADER.txt"
          grep -q 'Machine:.*ARM' "$OUTDIR/GUARD_ELF_HEADER.txt"
          EXPECTED_BRIDGE=$(sha256sum "$BIN" | awk '{print $1}')
          grep -Fq "$EXPECTED_BRIDGE" "$OUTDIR/SESSION_STRINGS.txt"
          grep -Fq 'architecture=mu1440-parity-cleanroom' "$OUTDIR/STRINGS.txt"
          grep -Fq 'source_clock=stream111-32.32' "$OUTDIR/STRINGS.txt"
          grep -Fq 'pts_clock=source-derived-90khz' "$OUTDIR/STRINGS.txt"
          grep -Fq 'frame_pacer=none' "$OUTDIR/STRINGS.txt"
          grep -Fq 'PARITY_START' "$OUTDIR/STRINGS.txt"
          grep -Fq 'PARITY_PTS_REBASE' "$OUTDIR/STRINGS.txt"
          grep -Fq '/tmp/mibr-alt111-recovery.request' "$OUTDIR/STRINGS.txt"
          grep -Fq 'M1KF1 ' "$OUTDIR/STRINGS.txt"
          grep -Fq 'PARITY_DRIVER interface' "$OUTDIR/STRINGS.txt"
          grep -Fq 'device_open_mode=write_only_nonblock' "$OUTDIR/STRINGS.txt"
          grep -Fq 'reference_producer_payload_limit=%u' "$OUTDIR/STRINGS.txt"
          grep -Fq 'PARITY_SAFE_RECOVERY' "$OUTDIR/STRINGS.txt"
          grep -Fq 'latency_packet_limit=%u' "$OUTDIR/STRINGS.txt"
          ! grep -Fq 'avformat_' "$OUTDIR/STRINGS.txt"
          ! grep -Fq 'libavformat' "$OUTDIR/STRINGS.txt"
          grep -Fq '/eso/bin/apps/dmdt' "$OUTDIR/SESSION_STRINGS.txt"
          grep -Fq '/tmp/mibr-alt111-au-framing.enabled' "$OUTDIR/SESSION_STRINGS.txt"
          grep -Fq 'PARITY_SESSION_SELFTEST=PASS' "$OUTDIR/SESSION_STRINGS.txt"
          sha256sum "$BIN" | tee "$OUTDIR/direct-ts-parity.sha256"
          sha256sum "$SESSION" | tee "$OUTDIR/parity-session.sha256"
          cat > "$OUTDIR/BUILDINFO.txt" <<INFO
          artifact=direct-ts-parity
          architecture=mu1440-parity-cleanroom
          target=$TARGET_FIRMWARE
          qnx=6.5-armv7-softfp
          source_commit=${{ github.event.pull_request.head.sha || github.sha }}
          source_path=src/native/direct-ts-parity/direct_ts_parity.c
          frame_pacer=none
          input=m1au-complete-au
          source_clock=stream111-32.32
          pts_clock=source-derived-90khz
          transport_bps=12288000
          pat_pid=0x0000
          pmt_pid=0x0010
          pcr_pid=0x1000
          video_pid=0x0011
          most_write_bytes=12032
          toolchain_commit=$TOOLCHAIN_COMMIT
          INFO
          sed -i 's/^          //' "$OUTDIR/BUILDINFO.txt"

      - name: Materialize and verify immutable complete candidate
        shell: bash
        env:
          SOURCE_HEAD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          bash tools/prepare_mu1440_parity_drive_v1_overlay.sh "$OUTDIR/package" "$OUTDIR/libaltscreen111.so" "$OUTDIR/direct-ts-parity" "$OUTDIR/parity-session"
          (cd "$OUTDIR/package"; sha256sum -c PACKAGE-SHA256SUMS.txt)
          while IFS= read -r script; do bash -n "$script"; done < <(find "$OUTDIR/package" -name '*.sh' -type f)
          ! grep -R -E 'classic_single_view_drive_supervisor\.sh|omonob790_drive_supervisor\.sh|classic_single_view-parity-drive|\[o\]parity_drive_supervisor\.sh' "$OUTDIR/package/runtime"
          grep -Fq '/net/mmx/fs/sda0/esd/carplay-test/logs/parity-drive' "$OUTDIR/package/runtime/parity_drive_supervisor.sh"
          grep -Fq '/net/mmx/fs/sda0/esd/carplay-test/logs/parity-drive' "$OUTDIR/package/runtime/parity_drive_status.sh"
          grep -Fxq "source_head_commit=$SOURCE_HEAD_COMMIT" "$OUTDIR/package/CANDIDATE-MANIFEST.txt"
          tar -czf "$OUTDIR/mu1440-parity-drive-candidate.tar.gz" -C "$OUTDIR" package

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: direct-ts-parity-MU1440-unstripped
          path: |
            ${{ env.OUTDIR }}/direct-ts-parity
            ${{ env.OUTDIR }}/direct-ts-parity.sha256
            ${{ env.OUTDIR }}/parity-session
            ${{ env.OUTDIR }}/parity-session.sha256
            ${{ env.OUTDIR }}/clockdiag-v1/
            ${{ env.OUTDIR }}/pollwait-v1/
            ${{ env.OUTDIR }}/pollwait-v2/
            ${{ env.OUTDIR }}/SESSION_FILE.txt
            ${{ env.OUTDIR }}/SESSION_ELF_HEADER.txt
            ${{ env.OUTDIR }}/BUILDINFO.txt
            ${{ env.OUTDIR }}/FILE.txt
            ${{ env.OUTDIR }}/ELF_HEADER.txt
            ${{ env.OUTDIR }}/DYNAMIC.txt
            ${{ env.OUTDIR }}/SYMBOLS.txt
            ${{ env.OUTDIR }}/libaltscreen111.so
            ${{ env.OUTDIR }}/alt111-settings
            ${{ env.OUTDIR }}/SETTINGS_ELF_HEADER.txt
            ${{ env.OUTDIR }}/libmibr_isotx2_guard.so
            ${{ env.OUTDIR }}/GUARD_ELF_HEADER.txt
            ${{ env.OUTDIR }}/decode-evidence/
            ${{ env.OUTDIR }}/mu1440-parity-drive-candidate.tar.gz
