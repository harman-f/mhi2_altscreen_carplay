name: Build unstripped MU1440 direct-ts-remux

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/build-direct-ts-remux.yml'
      - 'modules/carplay/source/direct-ts-remux/**'
      - 'tools/build_direct_ts_remux.sh'
      - 'tools/ci_qnx65_image.sh'
      - 'tools/qnx65-image.lock'
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-direct-ts-remux.yml'
      - 'modules/carplay/source/direct-ts-remux/**'
      - 'tools/build_direct_ts_remux.sh'
      - 'tools/ci_qnx65_image.sh'
      - 'tools/qnx65-image.lock'

permissions:
  contents: read
  packages: read

concurrency:
  group: public-direct-ts-remux-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TOOLCHAIN_REPO: https://github.com/luka-dev/qnx65-armv7-toolchain.git
  TOOLCHAIN_COMMIT: 56a66557245af14077678cd28a83ce3a337d9e2d
  TOOLCHAIN_DOCKERFILE_SHA256: 9a867a7ae70f2c0222a241b80232856526ccec0db2cfe013f8991ca31c74bcb1
  IMAGE: mhi2-qnx65-armv7-public:4.9
  OUTDIR: build/ci-direct-ts-remux
  TARGET_FIRMWARE: MHI2_ER_SKG13_P4526_MU1440

jobs:
  build:
    name: Build direct-ts-remux (QNX)
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Select verified QNX 6.5 ARMv7 image
        shell: bash
        env:
          QNX65_GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          bash tools/ci_qnx65_image.sh
      - name: Build exact vehicle-proven source without stripping
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf build/public-direct-ts-remux
          mkdir -p build/public-direct-ts-remux
          docker run --rm --platform=linux/amd64             -v "$PWD:/src"             -w /src             "$IMAGE"             bash -c 'bash ./tools/build_direct_ts_remux.sh modules/carplay/source/direct-ts-remux/direct_ts_remux.c build/public-direct-ts-remux/direct-ts-remux'
          sudo chown -R "$(id -u):$(id -g)" build/public-direct-ts-remux

      - name: Validate debug/symbol state and materialize reports
        shell: bash
        run: |
          set -euxo pipefail
          BIN=build/public-direct-ts-remux/direct-ts-remux
          mkdir -p "$OUTDIR"
          cp "$QNX_TOOLCHAIN_PROVENANCE" "$OUTDIR/QNX_TOOLCHAIN_PROVENANCE.txt"
          cp build/ffmpeg-remux/FFMPEG_SOURCE_ARCHIVE.txt "$OUTDIR/FFMPEG_SOURCE_ARCHIVE.txt"

          docker run --rm --platform=linux/amd64 -v "$PWD:/src" -w /src "$IMAGE" arm-unknown-nto-qnx6.5.0eabi-readelf -h "$BIN" > "$OUTDIR/ELF_HEADER.txt"
          docker run --rm --platform=linux/amd64 -v "$PWD:/src" -w /src "$IMAGE" arm-unknown-nto-qnx6.5.0eabi-readelf -S "$BIN" > "$OUTDIR/SECTIONS.txt"
          docker run --rm --platform=linux/amd64 -v "$PWD:/src" -w /src "$IMAGE" arm-unknown-nto-qnx6.5.0eabi-readelf -Ws "$BIN" > "$OUTDIR/SYMBOLS.txt"
          docker run --rm --platform=linux/amd64 -v "$PWD:/src" -w /src "$IMAGE" sh -lc "arm-unknown-nto-qnx6.5.0eabi-readelf -Ws '$BIN' | awk '\$7==\"UND\"{print \$8}' | sort -u" > "$OUTDIR/UNDEFINED.txt"
          docker run --rm --platform=linux/amd64 -v "$PWD:/src" -w /src "$IMAGE" arm-unknown-nto-qnx6.5.0eabi-readelf -d "$BIN" > "$OUTDIR/DYNAMIC.txt"
          docker run --rm --platform=linux/amd64 -v "$PWD:/src" -w /src "$IMAGE" arm-unknown-nto-qnx6.5.0eabi-readelf -r "$BIN" > "$OUTDIR/RELOCATIONS.txt"

          file "$BIN" | tee "$OUTDIR/FILE.txt"
          grep -q 'Machine:.*ARM' "$OUTDIR/ELF_HEADER.txt"
          grep -q '\.symtab' "$OUTDIR/SECTIONS.txt"
          grep -q '\.debug_info' "$OUTDIR/SECTIONS.txt"
          strings "$BIN" | grep -q 'REMUX_START'
          strings "$BIN" | grep -q 'MOST strict write'
          strings "$BIN" | grep -q 'mpegts'

          cp "$BIN" "$OUTDIR/direct-ts-remux"
          chmod 755 "$OUTDIR/direct-ts-remux"
          sha256sum "$OUTDIR/direct-ts-remux" > "$OUTDIR/direct-ts-remux.sha256"

          cat > "$OUTDIR/BUILDINFO.txt" <<EOF
          artifact=direct-ts-remux
          artifact_scope=H264_to_MPEGTS_to_isoTX2_developer_component
          target=QNX_6.5_ARMv7_softfp
          target_firmware=$TARGET_FIRMWARE
          source_public_commit=$GITHUB_SHA
          source_path=modules/carplay/source/direct-ts-remux/direct_ts_remux.c
          validation_scope=vehicle_tested_downstream_transport
          compiler=GCC_4.9.4_QNX_ARMv7
          optimization=-O2
          debug=-g
          stripped=no
          ffmpeg=6.1.5
          ffmpeg_sha256=05fbe9db1f5452a3605bb1d9bf91da9d4bb08162891692e4f172b58c49109412
          ffmpeg_archive_format=tar.xz
          toolchain_repo=$TOOLCHAIN_REPO
          toolchain_commit=$TOOLCHAIN_COMMIT
          toolchain_dockerfile_sha256=$TOOLCHAIN_DOCKERFILE_SHA256
          ci_run=$GITHUB_RUN_ID
          ci_attempt=$GITHUB_RUN_ATTEMPT
          EOF
          sed -i 's/^          //' "$OUTDIR/BUILDINFO.txt"

      - name: Upload CI artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: direct-ts-remux-MU1440-unstripped
          retention-days: 30
          path: |
            ${{ env.OUTDIR }}/direct-ts-remux
            ${{ env.OUTDIR }}/direct-ts-remux.sha256
            ${{ env.OUTDIR }}/QNX_TOOLCHAIN_PROVENANCE.txt
            ${{ env.OUTDIR }}/FFMPEG_SOURCE_ARCHIVE.txt
            ${{ env.OUTDIR }}/BUILDINFO.txt
            ${{ env.OUTDIR }}/FILE.txt
            ${{ env.OUTDIR }}/ELF_HEADER.txt
            ${{ env.OUTDIR }}/SECTIONS.txt
            ${{ env.OUTDIR }}/SYMBOLS.txt
            ${{ env.OUTDIR }}/UNDEFINED.txt
            ${{ env.OUTDIR }}/DYNAMIC.txt
            ${{ env.OUTDIR }}/RELOCATIONS.txt

